name: chaos

# Checks the chaos framework: every experiment against its schema and against the rules and metrics of the platform, and the runner
# and the load helper against a fake kubectl and a fake Prometheus. No cluster is used and nothing is run on one. See chaos/README.md
# and docs/adr/0029-chaos-experiments.md. The workflow only starts for the files below, so it is not a required check (a required
# check must report on every pull request, as Apps result does).
on:
  pull_request:
    paths:
      - "chaos/**"
      - "scripts/chaos-*"
      - "platform/observability/monitors/**"
      - "platform/observability/dashboards/**"
      - "scripts/tests/fakes/chaos/**"
      - "scripts/tests/fixtures/chaos/**"
      - "scripts/python-with-yaml.sh"
      - "scripts/shellcheck.sh"
      - ".yamllint.yaml"
      - ".github/workflows/chaos.yml"

permissions:
  contents: read

concurrency:
  group: chaos-${{ github.ref }}
  cancel-in-progress: true

env:
  # scripts/shellcheck.sh expects this version and runs it with -S style, so CI and local runs agree.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  check:
    name: Validate the experiments and test the runner
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # SHA pinned to the v7.0.1 release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: |
          file="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${file}"
          echo "${SHELLCHECK_SHA256}  ${file}" | sha256sum -c -
          tar -xJf "${file}"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      # The lint of the experiments renders the monitors chart to read the rules.
      # SHA pinned to the v4.3.1 release.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.1.4

      # yamllint brings PyYAML, which the runner needs.
      - name: Install yamllint
        run: pip install --user yamllint

      - name: Chaos framework
        run: ./scripts/chaos-check.sh
