name: observability

on:
  pull_request:
    paths:
      - "platform/observability/**"
      - "platform/argocd/**"
      - "scripts/**"
      - ".yamllint.yaml"
      - ".github/workflows/observability.yml"

permissions:
  contents: read

concurrency:
  group: observability-${{ github.ref }}
  cancel-in-progress: true

env:
  KUBECONFORM_VERSION: v0.8.0
  # Kubernetes versions the clusters run, used for schema validation.
  EKS_KUBERNETES_VERSION: "1.37.0"
  GKE_KUBERNETES_VERSION: "1.36.0"
  # scripts/shellcheck.sh expects this version and runs it with -S style, so CI and local runs agree.
  SHELLCHECK_VERSION: "0.11.0"
  SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198

jobs:
  check:
    name: Lint, render and validate
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs, as in apps.yml and images.yml.
      # SHA pinned to the v7.0.1 release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # SHA pinned to the v4.3.1 release.
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with:
          version: v4.1.4

      - name: Install kubeconform
        run: |
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Install shellcheck
        run: |
          file="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSLO "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${file}"
          echo "${SHELLCHECK_SHA256}  ${file}" | sha256sum -c -
          tar -xJf "${file}"
          sudo install -m 0755 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version

      - name: Install yamllint
        run: pip install --user yamllint

      # Renders and checks the metrics and logging charts (including Loki and Alloy), the dashboards and their
      # LogQL, the SLO rules (promtool) and the Alertmanager configuration (amtool and a running Alertmanager). The
      # configuration checks start the collector, Loki, Tempo, Alloy, Prometheus and Alertmanager images with the Docker
      # that is installed on the runner; the containers are removed by the script when it finishes.
      - name: Metrics, alerting and logging stack
        run: ./scripts/observability-check.sh

      # The tests of the check scripts (fixtures for the contract checks, fake clients for the teardown scripts) run
      # here too, so a change to a check cannot loosen it unnoticed.
      - name: Tests of the check scripts
        run: ./scripts/test-scripts.sh
