name: terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".tflint.hcl"
      - "scripts/terraform-validate.sh"
      - "scripts/terraform-test.sh"
      - ".github/workflows/terraform.yml"

permissions:
  contents: read

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: terraform fmt -check -recursive -diff infra/terraform

  validate:
    name: Validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: ./scripts/terraform-validate.sh

  test:
    name: Module tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.11.4"
      - run: ./scripts/terraform-test.sh

  tflint:
    name: TFLint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.65.0
      - name: Install plugins
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Run tflint
        run: tflint --recursive --config "$GITHUB_WORKSPACE/.tflint.hcl" --format compact
