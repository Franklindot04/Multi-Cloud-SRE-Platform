---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  config.yaml: |
    auth_enabled: true
    common:
      storage:
        s3:
          bucketnames: logs
    compactor:
      retention_enabled: false
    limits_config:
      retention_period: 720h
    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          schema: v12
