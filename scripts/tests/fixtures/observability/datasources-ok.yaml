---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  labels:
    grafana_datasource: "1"
data:
  datasource.yaml: |-
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      uid: prometheus
      url: http://prometheus:9090/
    - name: Alertmanager
      type: alertmanager
      uid: alertmanager
      url: http://alertmanager:9093/
      jsonData:
        handleGrafanaManagedAlerts: false
        implementation: prometheus
    - name: Loki
      type: loki
      uid: loki
      url: http://loki:3100
      jsonData:
        derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          matcherType: regex
          name: trace_id
          url: $${__value.raw}
    - name: Tempo
      type: tempo
      uid: tempo
      url: http://tempo:3200
      jsonData:
        nodeGraph:
          enabled: false
        tracesToLogsV2:
          customQuery: true
          datasourceUid: loki
          query: '{namespace=~".+"} |= `$${__trace.traceId}`'
          spanEndTimeShift: 5m
          spanStartTimeShift: -5m
