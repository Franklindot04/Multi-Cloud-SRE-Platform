---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki
data:
  config.yaml: |
    auth_enabled: false
    common:
      path_prefix: /var/loki
      storage:
        filesystem:
          chunks_directory: /var/loki/chunks
    compactor:
      retention_enabled: true
    limits_config:
      ingestion_burst_size_mb: 8
      ingestion_rate_mb: 4
      max_line_size: 256KB
      per_stream_rate_limit: 2MB
      retention_period: 48h
    schema_config:
      configs:
        - from: "2023-01-01"
          store: boltdb-shipper
          schema: v12
        - from: "2024-04-01"
          store: tsdb
          schema: v13
