---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo
data:
  tempo.yaml: |
    multitenancy_enabled: true
    usage_report:
      reporting_enabled: true
    compactor:
      compaction:
        block_retention: 720h
    distributor:
      receivers:
        jaeger:
          protocols:
            grpc:
              endpoint: 0.0.0.0:14250
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
    metrics_generator:
      storage:
        path: /tmp/tempo
    storage:
      trace:
        backend: s3
