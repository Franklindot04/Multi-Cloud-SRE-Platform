# Resources the platform-observability project must refuse: a webhook configuration (cluster-scoped kind that is not
# allowed), a DaemonSet (namespaced kind that is not allowed) and a Deployment in the shop namespace.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: demo
webhooks: []
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: demo
  namespace: observability
spec: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: shop
spec: {}
