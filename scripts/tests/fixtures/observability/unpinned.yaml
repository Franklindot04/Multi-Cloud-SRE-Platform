# An image that is pinned by tag only.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
  namespace: observability
spec:
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: example.invalid/demo:1.0.0
