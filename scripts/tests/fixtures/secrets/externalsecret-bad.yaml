---
# What the observability project must refuse: an ExternalSecret in another namespace, a store of the cluster-scoped kind and a
# namespaced SecretStore, which no project here uses.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: orders-db
  namespace: shop
spec: {}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: demo
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: demo
  namespace: observability
