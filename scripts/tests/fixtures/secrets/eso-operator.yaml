---
# A render of platform/security/external-secrets (chart 2.14.0, with ci/aws-params.yaml), without its CRDs except one small
# stand-in. It is kept so that scripts/test-scripts.sh needs no downloaded dependency: the chart's tarball is not committed and the
# test job does not build it, as for the Kyverno chart. scripts/external-secrets-check.sh builds the chart and fails if this file
# differs from the real render.
