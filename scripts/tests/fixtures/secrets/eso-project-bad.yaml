---
# What the platform-addons AppProject must refuse next to the External Secrets Operator: a workload in another namespace, cluster-scoped
# kinds that the chart does not render (a storage class and a persistent volume), and the store kinds that the project does not allow: the
# push kinds and a cluster generator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: shop
spec: {}
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: demo
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: demo
---
apiVersion: external-secrets.io/v1alpha1
kind: ClusterPushSecret
metadata:
  name: demo
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: ClusterGenerator
metadata:
  name: demo
