---
# A render of platform/delivery/argo-rollouts (chart 2.43.8, with ci/aws-params.yaml), with a small stand-in for each of its five CRDs
# in place of them. It is kept so that scripts/test-scripts.sh needs no downloaded dependency: the chart's tarball is not committed and
# the test job does not build it, as for the Kyverno and External Secrets charts. scripts/delivery-check.sh builds the chart and fails
# if this file differs from the real render.
