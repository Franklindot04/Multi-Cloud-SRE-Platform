---
# The Secrets the platform's passwords end up in, whichever way they are made: the in-cluster generator (the default) or External Secrets
# from Parameter Store (clusters labelled platform.example/external-secrets=true). The consumers read these names, types, labels and
# keys, so both ways have to produce exactly this. scripts/chart-contract-check.py (secrets-generated and secrets-external) compares
# the charts with it, in both modes, and scripts/external-secrets-check.sh runs the comparison. It holds no value.
#
#   namespace, name   the Secret
#   type              the Secret type (Opaque when the generator sets none)
#   labels            labels the Secret needs (CloudNativePG watches a role Secret that carries cnpg.io/reload)
#   keys              the keys of the Secret
#   remote            the paths in scripts/secrets/manifest.yaml that the Secret is made from; the other keys are fixed values from the
#                     charts (user names, hosts, ports, database names)
#   generator         what makes the Secret in the default mode: the chart that renders the generator Job, or the operator that
#                     generates it itself (RabbitMQ), in which case there is nothing to compare with in the charts
#   read by           who reads it
version: 1
secrets:
  - namespace: data
    name: pg-orders
    type: kubernetes.io/basic-auth
    labels: {cnpg.io/reload: "true"}
    keys: [username, password]
    remote: [postgres/orders-password]
    generator: platform/data/secrets
    read by: CloudNativePG (spec.managed.roles, passwordSecret), and the PreSync gate of the PostgreSQL chart
  - namespace: data
    name: pg-payments
    type: kubernetes.io/basic-auth
    labels: {cnpg.io/reload: "true"}
    keys: [username, password]
    remote: [postgres/payments-password]
    generator: platform/data/secrets
    read by: CloudNativePG (spec.managed.roles, passwordSecret), and the PreSync gate of the PostgreSQL chart
  - namespace: shop
    name: orders-db
    type: Opaque
    labels: {}
    keys: [username, password, host, port, dbname]
    remote: [postgres/orders-password]
    generator: platform/data/secrets
    read by: the orders service (DB_*)
  - namespace: shop
    name: payments-db
    type: Opaque
    labels: {}
    keys: [username, password, host, port, dbname]
    remote: [postgres/payments-password]
    generator: platform/data/secrets
    read by: the payments service (DB_*)
  - namespace: data
    name: valkey-auth
    type: Opaque
    labels: {}
    keys: [default]
    remote: [valkey/default-password]
    generator: platform/data/secrets
    read by: the Valkey chart (usersExistingSecret)
  - namespace: shop
    name: cache-auth
    type: Opaque
    labels: {}
    keys: [password, host, port]
    remote: [valkey/default-password]
    generator: platform/data/secrets
    read by: the orders service (CACHE_*)
  - namespace: data
    name: platform-mq-default-user
    type: Opaque
    labels: {}
    keys: [default_user.conf, username, password]
    remote: [rabbitmq/default-username, rabbitmq/default-password]
    generator: operator
    read by: the RabbitMQ Cluster Operator and the broker (spec.secretBackend.externalSecret in external mode)
  - namespace: shop
    name: rabbitmq-auth
    type: Opaque
    labels: {}
    keys: [username, password, host, port]
    remote: [rabbitmq/default-username, rabbitmq/default-password]
    generator: platform/data/rabbitmq-credentials
    read by: the orders and notifier services (AMQP_*)
  - namespace: observability
    name: grafana-admin
    type: Opaque
    labels: {}
    keys: [admin-user, admin-password]
    remote: [grafana/admin-password]
    generator: platform/observability/secrets
    read by: Grafana (admin.existingSecret)
