---
# Every secret value the platform needs, and nothing else. This file is the single source for scripts/seed-secrets.sh, which
# generates each value locally and writes it to AWS Systems Manager Parameter Store as a SecureString under
#
#   /<prefix>/<environment>/<name>        for example /multi-cloud-sre/dev/postgres/orders-password
#
# The file holds names, lengths and character sets, never a value. A check (scripts/chart-contract-check.py and
# scripts/test-scripts.sh) validates it, and the ExternalSecret manifests of the credential charts are checked against it: each one
# must point at a name listed here.
#
# What is not here, and why:
#   - user names that are fixed in the charts and are not secret (orders, payments, admin), hosts, ports and database names;
#     the External Secrets templates fill them in
#   - the certificate authority of cert-manager, which cert-manager generates and rotates itself
#   - the initial admin Secret of Argo CD, which Argo CD generates
#
# Rules for an entry:
#   name       <component>/<name>, lower case letters, digits and hyphens
#   length     the length of the generated value, including any prefix, 16 to 128
#   charset    a key of "charsets" below
#   prefix     optional text that starts the value (for a user name that has to begin with a letter)
#   consumers  who reads the value, as <namespace>/<Secret> <key> (<reader>)
#   unused     optional, true for a value that nothing reads yet; the check that every entry is read by an ExternalSecret skips it
#   note       optional
version: 1

# Character sets, as classes for tr(1). Only letters and digits are used: no character in them needs escaping in a URL, a
# connection string, a shell word, a JSON string or a YAML scalar, and the generators that build the Secrets today
# (platform/data/secrets, platform/observability/secrets) draw from the same set. Add a set only with a reason.
charsets:
  alnum: "A-Za-z0-9"

secrets:
  - name: postgres/orders-password
    length: 32
    charset: alnum
    consumers:
      - data/pg-orders password (CloudNativePG, the password of the role orders)
      - shop/orders-db password (the orders service, DB_PASSWORD_FILE)
    note: Used as a JDBC or asyncpg parameter and never inside a URL.

  - name: postgres/payments-password
    length: 32
    charset: alnum
    consumers:
      - data/pg-payments password (CloudNativePG, the password of the role payments)
      - shop/payments-db password (the payments service, DB_PASSWORD_FILE)
    note: Used as a JDBC parameter and never inside a URL.

  - name: valkey/default-password
    length: 32
    charset: alnum
    consumers:
      - data/valkey-auth default (the Valkey chart, the password of the user default)
      - shop/cache-auth password (the orders service, CACHE_PASSWORD_FILE)

  - name: rabbitmq/default-username
    length: 16
    charset: alnum
    prefix: mq
    consumers:
      - data/platform-mq-default-user username and default_user.conf (the RabbitMQ Cluster Operator and the broker, external mode)
      - shop/rabbitmq-auth username (the orders and notifier services, AMQP_USER)
    note: >-
      In external mode (clusters labelled platform.example/external-secrets=true) the broker starts with this user and password,
      through spec.secretBackend.externalSecret of the RabbitmqCluster, and an ExternalSecret makes rabbitmq-auth from the same two
      parameters. In the default mode the RabbitMQ Cluster Operator generates the user (Secret data/platform-mq-default-user) and a Job
      copies it to shop/rabbitmq-auth, and nothing reads these two entries.

  - name: rabbitmq/default-password
    length: 32
    charset: alnum
    consumers:
      - data/platform-mq-default-user password and default_user.conf (the RabbitMQ Cluster Operator and the broker, external mode)
      - shop/rabbitmq-auth password (the orders and notifier services, AMQP_PASSWORD_FILE)
    note: See rabbitmq/default-username.

  - name: grafana/admin-password
    length: 32
    charset: alnum
    consumers:
      - observability/grafana-admin admin-password (Grafana, the password of the user admin)
