spring.application.name=payments
spring.main.banner-mode=off
server.port=${PORT:8082}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_TIMEOUT_SECONDS:20}s
server.server-header=
server.tomcat.max-http-form-post-size=1MB
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.mvc.problemdetails.enabled=false
# Framework logs are JSON as well, so stdout stays machine-readable. Request logs use our own schema.
logging.structured.format.console=logstash
logging.level.root=WARN
