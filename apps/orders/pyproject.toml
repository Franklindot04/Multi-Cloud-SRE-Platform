[project]
name = "orders"
version = "1.0.0"
description = "Order lifecycle service for the sample order-processing application"
requires-python = ">=3.14,<3.15"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011", "E501"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]
markers = ["integration: needs the local data layer (PostgreSQL, Valkey, RabbitMQ); set INTEGRATION=1"]
