# Image registry, tag and digests for every service. A new build is rolled out by changing this file only.
#
# The registry is GitHub Container Registry under the lowercase owner name. The tag is the commit the images were
# built from, and each digest pins the exact image for that service.
image:
  registry: ghcr.io/franklindot04
  tag: "3563ec180ec022d58fbd053aab7bef8778822f86"

# sha256 digests per service, written together with the tag. A digest takes precedence over the tag when pulling.
digests:
