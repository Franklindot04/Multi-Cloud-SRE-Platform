---
# Data profile: PostgreSQL, Valkey and RabbitMQ in the data namespace. The Secrets are the ones created by
# platform/data (orders-db and cache-auth by the secrets chart, rabbitmq-auth by the rabbitmq-credentials chart).
# Safe with several replicas: the outbox relay claims its batch with FOR UPDATE SKIP LOCKED, so two replicas never publish the same
# row at the same time (apps/orders/tests/integration/test_live.py, test_two_relays_never_publish_the_same_event); an order moves from
# pending only with UPDATE ... WHERE status = 'pending', and a request is replayed by its Idempotency-Key, which PostgreSQL enforces
# with a unique key. Delivery is at least once and not ordered across replicas, and the notifier does not depend on the order.
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
env:
  STORAGE: postgres
  CACHE: valkey
  MESSAGING: rabbitmq
secretEnv:
  DB_HOST: {secret: orders-db, key: host}
  DB_PORT: {secret: orders-db, key: port}
  DB_NAME: {secret: orders-db, key: dbname}
  DB_USER: {secret: orders-db, key: username}
  CACHE_HOST: {secret: cache-auth, key: host}
  CACHE_PORT: {secret: cache-auth, key: port}
  AMQP_HOST: {secret: rabbitmq-auth, key: host}
  AMQP_PORT: {secret: rabbitmq-auth, key: port}
  AMQP_USER: {secret: rabbitmq-auth, key: username}
secretFiles:
  DB_PASSWORD_FILE: {secret: orders-db, key: password}
  CACHE_PASSWORD_FILE: {secret: cache-auth, key: password}
  AMQP_PASSWORD_FILE: {secret: rabbitmq-auth, key: password}
migration:
  enabled: true
  # Wait for the database (and the role and its password) instead of failing at once: the command retries
  # inside the pod until this many seconds have passed, which is shorter than the Job's 900 s deadline, so the
  # Job's retries are not used up while PostgreSQL comes up.
  command: [python, -m, orders.migrate]
  env:
    STORAGE: postgres
    MIGRATE_WAIT_SECONDS: "780"
  secretEnv:
    DB_HOST: {secret: orders-db, key: host}
    DB_PORT: {secret: orders-db, key: port}
    DB_NAME: {secret: orders-db, key: dbname}
    DB_USER: {secret: orders-db, key: username}
  secretFiles:
    DB_PASSWORD_FILE: {secret: orders-db, key: password}
networkPolicy:
  egressToData: [postgres, valkey, rabbitmq]
