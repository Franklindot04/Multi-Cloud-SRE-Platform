---
# Payments: simulated payment authorization. Java image (distroless, user 65532) that writes to /tmp.
port: 8082
runAsUser: 65532
tmpVolume:
  enabled: true
env:
  PAYMENT_DECLINE_ABOVE_MINOR: "100000"
  PAYMENT_APPROVAL_RATIO: "1.0"
  PAYMENT_ALLOWED_CURRENCIES: USD,EUR,GBP,SEK
  LOG_LEVEL: info
  # Traces go to the OpenTelemetry Collector (platform/observability/otel-collector, Service otel-collector in the
  # observability namespace, OTLP/gRPC on 4317). The http:// scheme means a plain connection, which is only right
  # inside the cluster; use https:// for anything else. Set the endpoint to an empty string to turn tracing off. If the Collector is
  # not installed the spans are dropped and the service logs one warning a minute.
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.observability.svc.cluster.local:4317
  OTEL_SERVICE_NAME: payments
  OTEL_RESOURCE_ATTRIBUTES: service.namespace=shop
  # Follow the caller's decision, and sample every trace that starts here (traffic is low). Lower the ratio to sample less.
  OTEL_TRACES_SAMPLER: parentbased_traceidratio
  OTEL_TRACES_SAMPLER_ARG: "1.0"
resources:
  requests:
    cpu: 100m
    memory: 320Mi
  limits:
    cpu: 500m
    memory: 640Mi
