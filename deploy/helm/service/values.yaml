---
# Defaults shared by every service. Each service overrides what it needs in deploy/helm/values/<service>.yaml, and
# one of <service>-memory.yaml or <service>-data.yaml selects the storage profile. The image registry and tag are
# set in deploy/helm/values/images.yaml, never here.

# The Kubernetes name of the Service, Deployment and so on. Defaults to the release name, so the release for
# the orders service is called "orders" and other services reach it at http://orders:8081.
name: ""

image:
  # PLACEHOLDER: replaced by values/images.yaml. It is only here so that the chart renders on its own.
  registry: ghcr.io/placeholder-owner
  # Repository name below the registry; defaults to the service name.
  name: ""
  # PLACEHOLDER tag. The CI change that builds the images writes the real tag to values/images.yaml.
  tag: "0.0.0-placeholder"
  # A digest (sha256:...) pins the image exactly. When set it is appended to the tag; the tag is then informational.
  digest: ""
  pullPolicy: IfNotPresent

# Per-service image digests, written next to the tag by CI: {gateway: "sha256:...", orders: "sha256:..."}.
digests: {}

imagePullSecrets: []

# A fixed number of replicas. Leave it unset (null) when autoscaling.enabled is true: the Deployment then has no replicas field and
# the autoscaler owns the count, so Argo CD and the autoscaler do not fight over it. Setting both is refused.
replicas: null
port: 8080

# Numeric user and group the image runs as (see the Dockerfile of the service).
runAsUser: 65532

# Plain environment variables. Values are always rendered as strings.
env: {}

# Environment variables read from a Secret key: {ENV_NAME: {secret: name, key: key}}.
secretEnv: {}

# Passwords are mounted as files, not passed as environment variables. {ENV_NAME: {secret: name, key: key}}
# mounts the key read-only under /var/run/secrets/<secret>/ and sets ENV_NAME to the file path.
secretFiles: {}

# The services read SHUTDOWN_DRAIN_SECONDS and SHUTDOWN_TIMEOUT_SECONDS; the chart sets them from here so the
# pod's grace period can be derived from the same numbers.
shutdown:
  # Time between the pod being marked terminating and SIGTERM, so that Service endpoints are removed first.
  preStopSeconds: 5
  # Time /readyz fails after SIGTERM before the listener stops (the service's drain period).
  drainSeconds: 5
  # Time in-flight requests have to finish after the listener stops.
  timeoutSeconds: 20
  # Slack added to the grace period.
  bufferSeconds: 5

# Needed only by images whose process writes to /tmp (the Java service). Everything else runs with an
# unwritable root filesystem and no scratch volume.
tmpVolume:
  enabled: false
  sizeLimit: 64Mi

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    cpu: 200m
    memory: 128Mi

probes:
  startup:
    path: /healthz
    periodSeconds: 2
    # failureThreshold * periodSeconds is the time a slow start (the JVM) is allowed to take.
    failureThreshold: 60
  readiness:
    path: /readyz
    periodSeconds: 5
    timeoutSeconds: 2
    failureThreshold: 3
  liveness:
    path: /healthz
    periodSeconds: 10
    timeoutSeconds: 2
    failureThreshold: 3

# An existing PriorityClass from platform/addons/priority-classes. Empty means the cluster default.
priorityClassName: platform-apps

# Scale on CPU with a HorizontalPodAutoscaler (autoscaling/v2). Only for a service that is safe with several replicas, which
# the values file of that service says. The utilisation is measured against the CPU request, so it follows the request. Needs
# metrics-server (platform/addons/metrics-server on EKS; GKE has its own).
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70
  # Scale up at once (the Kubernetes default), scale down only after the load has been lower for this long.
  scaleDownStabilizationSeconds: 300

# Keeps one pod of a node drain or a Spot replacement from taking the service down. It is rendered only when the service
# has more than one replica (replicas, or autoscaling.minReplicas): on a single replica it would block every drain.
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1

# Spread the replicas over nodes and over zones. ScheduleAnyway keeps pods schedulable on a small or single-zone cluster and
# only prefers the spread; a production profile can use DoNotSchedule, which leaves a pod Pending rather than break it.
topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

nodeSelector: {}
tolerations: []
podAnnotations: {}

service:
  # ClusterIP only. Nothing else in this chart is exposed to the internet.
  type: ClusterIP

metrics:
  # Adds prometheus.io/* annotations to the pods. Off by default.
  scrapeAnnotations: false
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels the Prometheus instance selects ServiceMonitors by.
    labels: {}

# Network policies for the pods of this release, enforced by the cluster's network plugin (the VPC CNI on EKS, Dataplane V2
# on GKE). Each release denies all ingress and egress for its own pods and then allows what the service really does, so
# a service gets only the paths listed here. The services need nothing from the Kubernetes API (no token is mounted).
# Each service lists its callers and destinations in values/<service>.yaml and in its profile file.
networkPolicy:
  enabled: true
  # Services in this namespace that may call this one, and that this one calls. Names from "services" below.
  ingressFrom: []
  egressTo: []
  # Destinations in the data namespace this service uses: any of postgres, valkey, rabbitmq (see "dataTargets").
  egressToData: []
  # OTLP/gRPC to the OpenTelemetry Collector. Turn off together with OTEL_EXPORTER_OTLP_ENDPOINT.
  collector: true
  # The VPC CNI network policy agent matches an egress rule against the address the pod connects to, and a connection to a
  # Service goes to the Service's ClusterIP, which is only translated to a pod afterwards. A rule that names the pods behind
  # a Service therefore does not let traffic through to it. Each egress rule has a second peer, this address range (the
  # cluster's Service range), on the same port; the destination's ingress rule, which is matched against the pod, still
  # says who may connect. The range comes from the cluster (the annotation platform.example/service-cidr, written by
  # scripts/bootstrap-argocd.sh from the Terraform output service_cidr_block), is never committed, and the chart refuses to
  # render without it.
  serviceCidr: ""
  # Set to false on a network plugin that matches egress after the address is translated (for example GKE Dataplane V2):
  # the Service range is then neither needed nor used.
  matchServiceAddresses: true
  # Where traffic from a load balancer comes from, normally the VPC CIDR. Needed (and required) when the ingress is
  # enabled, because the load balancer sends traffic straight to the pod IPs. Never set from Git: Argo CD passes it
  # from the cluster.
  ingressCidrs: []
  # DNS: the pods of the cluster DNS service.
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
  # Prometheus scrapes the metrics port (the service port) of every service from here.
  prometheus:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack-prometheus
  collectorTarget:
    namespace: observability
    podLabels:
      app.kubernetes.io/name: otel-collector
    port: 4317
  # The port of each service in this namespace (the service port of its values file).
  services:
    gateway: 8080
    orders: 8081
    payments: 8082
    notifier: 8083
  # Pods and ports of the data layer (platform/data), in the data namespace.
  dataNamespace: data
  dataTargets:
    postgres:
      podLabels:
        cnpg.io/cluster: platform-pg
        cnpg.io/podRole: instance
      port: 5432
    valkey:
      podLabels:
        app.kubernetes.io/name: valkey
      port: 6379
    rabbitmq:
      podLabels:
        app.kubernetes.io/name: platform-mq
        app.kubernetes.io/component: rabbitmq
      port: 5672

# A one-shot Job that runs before the Deployment is updated (an Argo CD PreSync hook). It gets its own
# environment: only what the migration needs, not the whole service configuration.
migration:
  enabled: false
  command: []
  args: []
  env: {}
  secretEnv: {}
  secretFiles: {}
  # The Job is retried until activeDeadlineSeconds, then fails and stops the sync.
  backoffLimit: 10
  activeDeadlineSeconds: 900
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 256Mi

# Off by default. Enabling it creates a billed load balancer (AWS Application Load Balancer or Google Cloud
# external or internal HTTP(S) load balancer).
ingress:
  enabled: false
  # aws (AWS Load Balancer Controller) or gcp (built-in GKE ingress). Set by values/cloud-<cloud>.yaml.
  cloud: ""
  # internet-facing or internal
  scheme: internet-facing
  host: ""
  # AWS only: ACM certificate ARN. An identifier, so it is supplied at deploy time and never committed.
  certificateArn: ""
  # GCP only: name of a reserved static address.
  staticIpName: ""
  annotations: {}

# A cert-manager Certificate for the ingress host. The AWS load balancer takes its certificate from ACM and
# cannot use it; it is for the GKE ingress or another controller that reads a TLS Secret.
certificate:
  enabled: false
  secretName: ""
  issuerName: letsencrypt-staging
  issuerKind: ClusterIssuer
