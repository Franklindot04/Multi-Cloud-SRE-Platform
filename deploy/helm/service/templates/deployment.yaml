{{- $name := include "service.name" . -}}
{{- include "service.validateScaling" . -}}
{{- include "service.validateRollout" . -}}
{{- /* With rollout.enabled the workload is the Rollout (rollout.yaml), from the same pod template. */ -}}
{{- if not .Values.rollout.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  {{- /* With an autoscaler the field is left out, so the autoscaler's count is not reset by a sync. */}}
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ default 1 .Values.replicas }}
  {{- end }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod must be ready before an old one is removed, so a rollout never lowers capacity.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}
  template:
    {{- include "service.podTemplate" . | nindent 4 }}
{{- end }}
