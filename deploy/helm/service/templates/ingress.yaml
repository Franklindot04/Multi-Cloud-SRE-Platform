{{- if .Values.ingress.enabled }}
{{- $cloud := .Values.ingress.cloud -}}
{{- if not (has $cloud (list "aws" "gcp")) }}{{ fail "ingress.cloud must be aws or gcp when the ingress is enabled" }}{{ end -}}
{{- if not (has .Values.ingress.scheme (list "internet-facing" "internal")) }}{{ fail "ingress.scheme must be internet-facing or internal" }}{{ end -}}
{{- $tls := or .Values.certificate.enabled .Values.ingress.certificateArn -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
  annotations:
    {{- if eq $cloud "aws" }}
    # AWS Load Balancer Controller: an Application Load Balancer that sends traffic straight to pod IPs.
    alb.ingress.kubernetes.io/scheme: {{ .Values.ingress.scheme }}
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: traffic-port
    {{- if $tls }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    {{- end }}
    {{- with .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ . | quote }}
    {{- end }}
    {{- else }}
    # Built-in GKE ingress: an external or internal HTTP(S) load balancer. The health check is set by the BackendConfig.
    kubernetes.io/ingress.class: {{ ternary "gce" "gce-internal" (eq .Values.ingress.scheme "internet-facing") | quote }}
    {{- if $tls }}
    kubernetes.io/ingress.allow-http: "false"
    {{- end }}
    {{- with .Values.ingress.staticIpName }}
    kubernetes.io/ingress.global-static-ip-name: {{ . | quote }}
    {{- end }}
    {{- end }}
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if eq $cloud "aws" }}
  ingressClassName: alb
  {{- end }}
  {{- if .Values.certificate.enabled }}
  tls:
    - hosts:
        - {{ required "ingress.host is required with certificate.enabled" .Values.ingress.host | quote }}
      secretName: {{ default (printf "%s-tls" (include "service.name" .)) .Values.certificate.secretName }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "service.name" . }}
                port:
                  name: http
      {{- with .Values.ingress.host }}
      host: {{ . | quote }}
      {{- end }}
{{- end }}
