{{- if and .Values.ingress.enabled .Values.certificate.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  secretName: {{ default (printf "%s-tls" (include "service.name" .)) .Values.certificate.secretName }}
  dnsNames:
    - {{ required "ingress.host is required with certificate.enabled" .Values.ingress.host | quote }}
  issuerRef:
    name: {{ .Values.certificate.issuerName }}
    kind: {{ .Values.certificate.issuerKind }}
{{- end }}
