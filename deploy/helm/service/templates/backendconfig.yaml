{{- if and .Values.ingress.enabled (eq .Values.ingress.cloud "gcp") }}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "service.name" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: {{ .Values.port }}
{{- end }}
