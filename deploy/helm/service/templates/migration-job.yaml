{{- if .Values.migration.enabled }}
{{- $name := include "service.name" . -}}
{{- $m := .Values.migration -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-migrate
  labels:
    {{- include "service.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    # Runs before anything else in the sync. If it fails the sync stops and the running pods keep serving.
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ $m.backoffLimit }}
  activeDeadlineSeconds: {{ $m.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "service.labels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      # A PreSync hook runs before the ServiceAccount of the Deployment exists on a first install, and the
      # migration never calls the Kubernetes API, so it uses the namespace default account with no token.
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "service.podSecurityContext" . | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with $m.command }}
          command:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          {{- with $m.args }}
          args:
            {{- toYaml . | trim | nindent 12 }}
          {{- end }}
          env:
            {{- include "service.envList" (dict "env" $m.env "secretEnv" $m.secretEnv "secretFiles" $m.secretFiles) | trim | nindent 12 }}
          resources:
            {{- toYaml $m.resources | trim | nindent 12 }}
          securityContext:
            {{- include "service.containerSecurityContext" . | trim | nindent 12 }}
          volumeMounts:
            {{- if .Values.tmpVolume.enabled }}
            - name: tmp
              mountPath: /tmp
            {{- end }}
            {{- include "service.secretMounts" (dict "secretFiles" $m.secretFiles) | trim | nindent 12 }}
      {{- if or .Values.tmpVolume.enabled $m.secretFiles }}
      volumes:
        {{- if .Values.tmpVolume.enabled }}
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.tmpVolume.sizeLimit }}
        {{- end }}
        {{- include "service.secretVolumes" (dict "secretFiles" $m.secretFiles) | nindent 8 }}
      {{- end }}
{{- end }}
