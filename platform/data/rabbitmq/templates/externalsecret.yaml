{{- /*
The Secret the RabbitMQ Cluster Operator reads the default user from when the cluster has spec.secretBackend.externalSecret. Same name
as the Secret the operator generates itself (platform-mq-default-user). Rendered only when externalSecrets.enabled is true.

What the operator needs, read in operator 2.23.1 (internal/resource/statefulset.go and docs/examples/external-admin-secret-credentials):
the StatefulSet projects the key default_user.conf of this Secret into the broker's configuration, and the setup container derives the
credentials of rabbitmqadmin from it; the username and the password are the other two keys of the operator's default-user Secret and
what its status refers to. The example in the operator's documentation also has host, port, provider and type (the Service Binding
Spec), which nothing in the operator reads and which no consumer here reads from this Secret (the services read rabbitmq-auth in shop),
so they are left out. The user name and the password come from Parameter Store.
*/ -}}
{{- if include "secrets.external" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecrets.secretName }}
  namespace: {{ .Values.cluster.namespace }}
  annotations:
    # The CRD comes from the operator Application (wave 3), which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.externalSecrets.secretName }}
    creationPolicy: Owner
    template:
      data:
        default_user.conf: |
          default_user = {{ `{{ .username }}` }}
          default_pass = {{ `{{ .password }}` }}
        username: {{ `"{{ .username }}"` }}
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.externalSecrets.usernameParameter) }}
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.externalSecrets.passwordParameter) }}
{{- end }}
