{{- /*
The Secret rabbitmq-auth in the shop namespace, made by External Secrets from the same two parameters the broker starts with
(platform/data/rabbitmq, external mode), instead of the Job that copies the operator's Secret (templates/copy.yaml): same name,
namespace and keys (username, password, host, port). The copy Job, which uses a public image and carries the exempt label of the
admission policies, is not rendered. Rendered only when externalSecrets.enabled is true.
*/ -}}
{{- if include "secrets.external" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.targetSecret }}
  namespace: {{ .Values.appNamespace }}
  annotations:
    # The CRD comes from the operator Application (wave 3), which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.targetSecret }}
    creationPolicy: Owner
    template:
      data:
        username: {{ `"{{ .username }}"` }}
        password: {{ `"{{ .password }}"` }}
        host: {{ .Values.host | quote }}
        port: {{ .Values.port | quote }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.usernameParameter) }}
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.passwordParameter) }}
{{- end }}
