---
# A hook Job creates each Secret only if it does not exist yet, with a random password generated in the
# cluster. Existing Secrets are never changed, so re-syncs do not rotate credentials.
image: curlimages/curl:8.23.0

# The Job gates the data layer, so it ranks with it.
priorityClassName: platform-addons-critical

dataNamespace: data
appNamespace: shop

postgres:
  # CloudNativePG read-write service of the cluster in the postgres chart (<cluster>-rw.<namespace>.svc).
  host: platform-pg-rw.data.svc
  port: "5432"
  # One role and database per service. "secret" is the source Secret in the data namespace (read by
  # CloudNativePG for the role); "appSecret" is the copy the service reads in the application namespace.
  users:
    - name: orders
      database: orders
      secret: pg-orders
      appSecret: orders-db
      parameter: postgres/orders-password
    - name: payments
      database: payments
      secret: pg-payments
      appSecret: payments-db
      parameter: postgres/payments-password

valkey:
  host: platform-valkey.data.svc
  port: "6379"
  # The Valkey chart reads the password of its "default" user from the key "default" of this Secret.
  secret: valkey-auth
  appSecret: cache-auth
  parameter: valkey/default-password

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# The generator Job runs during a sync (an Argo CD Sync hook) and is removed when it succeeds. A failed one is
# kept for inspection and removed after ttlSecondsAfterFinished.
job:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

# Where the passwords come from. Off (the default): the generator Job in this chart makes them in the cluster, once, as before.
# On: the generator, its RBAC and the Secrets it makes are not rendered; ExternalSecrets make the same Secrets (same names, types,
# labels and keys) from the SecureString parameters of AWS Systems Manager Parameter Store, which scripts/seed-secrets.sh writes,
# through the ClusterSecretStore below. Argo CD sets enabled from the cluster label platform.example/external-secrets and prefix
# from the annotation platform.example/secrets-prefix (/<prefix>/<environment>, for example /multi-cloud-sre/dev); the chart
# refuses to render without the prefix when enabled. The parameter names are the paths of scripts/secrets/manifest.yaml.
externalSecrets:
  enabled: false
  prefix: ""
  storeName: aws-parameter-store
  refreshInterval: 1h
