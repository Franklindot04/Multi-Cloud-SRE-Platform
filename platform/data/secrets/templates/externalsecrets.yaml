{{- /*
The same Secrets as the generator makes (templates/generate.yaml), made by External Secrets from Parameter Store: same names, same
namespaces, same types, same labels, same keys, so no consumer changes. Rendered only when externalSecrets.enabled is true.
scripts/chart-contract-check.py (secrets-external, secrets-parity) compares them with scripts/secrets/contract.yaml. Nothing here holds a
value: the password comes from the parameter, the rest is chart values.

The ExternalSecrets are ordinary resources (sync wave -5). The PostgreSQL chart's gate Job, the Valkey pod and the services wait for the
Secrets themselves, as they do with the generator. Argo CD's health check for an ExternalSecret is Healthy when its Ready condition is
true, so this Application is Progressing or Degraded, and retries, until the parameter exists and the store answers.
*/ -}}
{{- if include "secrets.external" . }}
{{- $store := .Values.externalSecrets.storeName }}
{{- $interval := .Values.externalSecrets.refreshInterval }}
{{- range .Values.postgres.users }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .secret }}
  namespace: {{ $.Values.dataNamespace }}
  annotations:
    # The CRD comes from the operator Application (wave 3), which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .secret }}
    creationPolicy: Owner
    template:
      # CloudNativePG reads the role's password from a basic-auth Secret, and watches it when it carries this label.
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: {{ .name | quote }}
        password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .parameter) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .appSecret }}
  namespace: {{ $.Values.appNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .appSecret }}
    creationPolicy: Owner
    template:
      data:
        username: {{ .name | quote }}
        password: {{ `"{{ .password }}"` }}
        host: {{ $.Values.postgres.host | quote }}
        port: {{ $.Values.postgres.port | quote }}
        dbname: {{ .database | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .parameter) }}
{{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.secret }}
  namespace: {{ .Values.dataNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.valkey.secret }}
    creationPolicy: Owner
    template:
      data:
        # The Valkey chart reads the password of its "default" user from this key.
        default: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.valkey.parameter) }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.valkey.appSecret }}
  namespace: {{ .Values.appNamespace }}
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ $interval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ $store }}
  target:
    name: {{ .Values.valkey.appSecret }}
    creationPolicy: Owner
    template:
      data:
        password: {{ `"{{ .password }}"` }}
        host: {{ .Values.valkey.host | quote }}
        port: {{ .Values.valkey.port | quote }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.valkey.parameter) }}
{{- end }}
