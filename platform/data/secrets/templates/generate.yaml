{{- /*
The ServiceAccount, Roles and RoleBindings are ordinary resources (sync wave -5), so the Application always has
something to sync and Argo CD starts the first sync on its own. A chart that contains only hooks renders nothing
to compare, so Argo CD reports it Synced and Healthy without ever running a sync, and the Job never runs.

The generator is an Argo CD Sync hook (wave 0, after the RBAC): it runs during a sync, is removed when it
succeeds, and is not compared with the live state, so its disappearance never makes the Application OutOfSync
and nothing re-runs it in a loop. ttlSecondsAfterFinished cleans up a failed Job after an hour.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: data-secrets-manifest
  namespace: {{ .Values.dataNamespace }}
  labels:
    platform.example/purpose: credential-generator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  # Names only, never values: the Secrets this chart makes sure exist. Created once and never overwritten.
  secrets: |
    {{- range .Values.postgres.users }}
    {{ $.Values.dataNamespace }}/{{ .secret }}
    {{ $.Values.appNamespace }}/{{ .appSecret }}
    {{- end }}
    {{ .Values.dataNamespace }}/{{ .Values.valkey.secret }}
    {{ .Values.appNamespace }}/{{ .Values.valkey.appSecret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-secrets-generator
  namespace: {{ .Values.dataNamespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
{{- range $ns := list .Values.dataNamespace .Values.appNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-secrets-generator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
  {{- if eq $ns $.Values.dataNamespace }}
  # The PostgreSQL role Secrets carry the label that makes CloudNativePG watch them, so a Secret that appears
  # (or changes) after the Cluster is picked up at once. Existing ones get the label if they lack it.
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      {{- range $.Values.postgres.users }}
      - {{ .secret }}
      {{- end }}
    verbs: ["patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-secrets-generator
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-secrets-generator
subjects:
  - kind: ServiceAccount
    name: data-secrets-generator
    namespace: {{ $.Values.dataNamespace }}
---
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: data-secrets-generator
  namespace: {{ .Values.dataNamespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    spec:
      serviceAccountName: data-secrets-generator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: {{ .Values.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat "$SA/token")"

              call() { curl -sS --max-time 20 --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" "$@"; }
              http_status() { call -o /dev/null -w '%{http_code}' "$API/api/v1/namespaces/$1/secrets/$2"; }
              password_of() {
                call "$API/api/v1/namespaces/$1/secrets/$2" | sed -n 's/.*"password": *"\([^"]*\)".*/\1/p' | base64 -d
              }
              new_password() { head -c 48 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32; }

              # create NAMESPACE NAME JSON: 201 created, 409 already exists, anything else is an error.
              create() {
                code="$(call -o /tmp/response -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                  -d "$3" "$API/api/v1/namespaces/$1/secrets")"
                case "$code" in
                  201) echo "created $1/$2" ;;
                  409) echo "exists  $1/$2" ;;
                  *) echo "failed  $1/$2: HTTP $code" >&2; cat /tmp/response >&2; exit 1 ;;
                esac
              }

              # label_for_reload NAMESPACE NAME: makes CloudNativePG watch the Secret. Idempotent, changes no data.
              label_for_reload() {
                code="$(call -o /tmp/response -w '%{http_code}' -X PATCH -H 'Content-Type: application/merge-patch+json' \
                  -d '{"metadata":{"labels":{"cnpg.io/reload":"true"}}}' "$API/api/v1/namespaces/$1/secrets/$2")"
                [ "$code" = 200 ] || { echo "failed  label $1/$2: HTTP $code" >&2; cat /tmp/response >&2; exit 1; }
              }

              # ensure_password NAMESPACE NAME USERNAME: prints the password, creating the Secret if needed.
              # An existing Secret is never regenerated or overwritten.
              ensure_password() {
                if [ "$(http_status "$1" "$2")" = 200 ]; then
                  echo "exists  $1/$2" >&2
                  password_of "$1" "$2"
                else
                  pw="$(new_password)"
                  create "$1" "$2" "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"$2\",\"labels\":{\"cnpg.io/reload\":\"true\"}},\"type\":\"kubernetes.io/basic-auth\",\"stringData\":{\"username\":\"$3\",\"password\":\"$pw\"}}" >&2
                  echo "$pw"
                fi
              }

              {{- range .Values.postgres.users }}

              pw="$(ensure_password {{ $.Values.dataNamespace }} {{ .secret }} {{ .name }})"
              label_for_reload {{ $.Values.dataNamespace }} {{ .secret }}
              if [ "$(http_status {{ $.Values.appNamespace }} {{ .appSecret }})" != 200 ]; then
                create {{ $.Values.appNamespace }} {{ .appSecret }} "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ .appSecret }}\"},\"stringData\":{\"username\":\"{{ .name }}\",\"password\":\"$pw\",\"host\":\"{{ $.Values.postgres.host }}\",\"port\":\"{{ $.Values.postgres.port }}\",\"dbname\":\"{{ .database }}\"}}"
              else
                echo "exists  {{ $.Values.appNamespace }}/{{ .appSecret }}"
              fi
              {{- end }}

              # Valkey: the chart reads the "default" user's password from the key "default".
              if [ "$(http_status {{ .Values.dataNamespace }} {{ .Values.valkey.secret }})" = 200 ]; then
                echo "exists  {{ .Values.dataNamespace }}/{{ .Values.valkey.secret }}"
                vpw="$(call "$API/api/v1/namespaces/{{ .Values.dataNamespace }}/secrets/{{ .Values.valkey.secret }}" | sed -n 's/.*"default": *"\([^"]*\)".*/\1/p' | base64 -d)"
              else
                vpw="$(new_password)"
                create {{ .Values.dataNamespace }} {{ .Values.valkey.secret }} "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ .Values.valkey.secret }}\"},\"stringData\":{\"default\":\"$vpw\"}}"
              fi
              if [ "$(http_status {{ .Values.appNamespace }} {{ .Values.valkey.appSecret }})" != 200 ]; then
                create {{ .Values.appNamespace }} {{ .Values.valkey.appSecret }} "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ .Values.valkey.appSecret }}\"},\"stringData\":{\"password\":\"$vpw\",\"host\":\"{{ .Values.valkey.host }}\",\"port\":\"{{ .Values.valkey.port }}\"}}"
              else
                echo "exists  {{ .Values.appNamespace }}/{{ .Values.valkey.appSecret }}"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
