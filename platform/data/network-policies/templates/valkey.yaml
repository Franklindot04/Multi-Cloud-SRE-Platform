{{- if .Values.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-from-services
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  podSelector:
    matchLabels:
      {{- toYaml .Values.pods.valkey | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- include "np.services" (dict "root" . "names" .Values.services.valkey) | nindent 8 }}
      ports:
        - protocol: TCP
          port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: valkey-allow-between-pods
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Replication between the primary and the replicas of the HA profile. With one pod there is no such traffic.
  podSelector:
    matchLabels:
      {{- toYaml .Values.pods.valkey | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.pods.valkey | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- toYaml .Values.pods.valkey | nindent 14 }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
