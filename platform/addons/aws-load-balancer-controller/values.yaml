---
aws-load-balancer-controller:
  replicaCount: 2
  priorityClassName: system-cluster-critical

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

  podDisruptionBudget:
    maxUnavailable: 1

  podSecurityContext:
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # Keep the two replicas on different nodes where possible.
  affinity:
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: aws-load-balancer-controller

  # IngressClass "alb" is created and handles Ingress resources with ALBs.
  ingressClass: alb
  createIngressClassResource: true
  enableServiceMutatorWebhook: true

  serviceAccount:
    create: true
    name: aws-load-balancer-controller
