---
# Cluster-specific identifiers (cluster name, region, VPC ID and the IRSA role ARN) are not stored in
# Git. Argo CD supplies them as Helm parameters from the annotations on the cluster secret; see
# platform/argocd/apps. For a manual install pass them with --set-string (see the add-ons runbook).
#
# The chart generates a new self-signed webhook certificate on every render. The ApplicationSet
# ignores that drift (see platform/argocd/apps).
aws-load-balancer-controller:
  defaultTags:
    project: multi-cloud-sre
    managed-by: argocd
