---
# Higher than application workloads, lower than the built-in system-* classes.
# The system-* classes are reserved for kube-system, so add-ons in their own
# namespaces use this class instead.
platformAddonsCritical:
  name: platform-addons-critical
  value: 1000000

# The sample application services (deploy/helm/service). Below the add-ons they depend on, so a node under
# pressure evicts an application pod before it evicts cert-manager or external-dns.
platformApps:
  name: platform-apps
  value: 100000

# The observability stack (metrics, logs, traces). Below the services: when a node is short of room the stack goes first, and an
# autoscaler adding a service pod never has to wait for it. Above pods with no class, so it is not the first thing a pod without a
# class pushes off a node.
platformObservability:
  name: platform-observability
  value: 10000
