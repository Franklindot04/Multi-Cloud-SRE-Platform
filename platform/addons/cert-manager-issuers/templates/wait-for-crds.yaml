{{- if .Values.waitForCrds.enabled }}
{{- /* Helm hooks double as Argo CD PreSync hooks. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cert-manager-issuers-wait
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cert-manager-issuers-wait
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames:
      - certificates.cert-manager.io
      - clusterissuers.cert-manager.io
      - issuers.cert-manager.io
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cert-manager-issuers-wait
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cert-manager-issuers-wait
subjects:
  - kind: ServiceAccount
    name: cert-manager-issuers-wait
    namespace: {{ .Values.namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cert-manager-issuers-wait
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cert-manager-issuers-wait
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cert-manager-issuers-wait
subjects:
  - kind: ServiceAccount
    name: cert-manager-issuers-wait
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: cert-manager-issuers-wait
  namespace: {{ .Values.namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 900
  template:
    spec:
      serviceAccountName: cert-manager-issuers-wait
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: crds-exist
          image: {{ .Values.waitForCrds.image }}
          args:
            - wait
            - --for=create
            - --timeout={{ .Values.waitForCrds.timeout }}
            - crd/certificates.cert-manager.io
            - crd/clusterissuers.cert-manager.io
            - crd/issuers.cert-manager.io
          securityContext: &containerSecurityContext
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: &resources
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
        - name: crds-established
          image: {{ .Values.waitForCrds.image }}
          args:
            - wait
            - --for=condition=Established
            - --timeout={{ .Values.waitForCrds.timeout }}
            - crd/certificates.cert-manager.io
            - crd/clusterissuers.cert-manager.io
            - crd/issuers.cert-manager.io
          securityContext: *containerSecurityContext
          resources: *resources
      containers:
        - name: webhook-ready
          image: {{ .Values.waitForCrds.image }}
          args:
            - rollout
            - status
            - --namespace={{ .Values.namespace }}
            - --timeout={{ .Values.waitForCrds.timeout }}
            - deployment/{{ .Values.waitForCrds.webhookDeployment }}
          securityContext: *containerSecurityContext
          resources: *resources
{{- end }}
