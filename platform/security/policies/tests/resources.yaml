---
# Resources for the Kyverno tests of the policies (kyverno-test.yaml). Written by hand-checked cases: one that follows every policy, and
# one for each way to break one. The digest is made up.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: good-deployment
  namespace: shop
spec:
  selector:
    matchLabels:
      app: good-deployment
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/franklindot04/gateway:1.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app: good-deployment
---
