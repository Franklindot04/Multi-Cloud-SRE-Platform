{{- if .Values.policies.restrictImageRegistries.enabled }}
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: restrict-image-registries
  annotations:
    policies.kyverno.io/title: Restrict image registries
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/description: >-
      Every container and init container uses an image from {{ .Values.registry }}. Ephemeral containers are not checked, because a
      pod is changed to add one through the subresource pods/ephemeralcontainers, which this policy does not match, and the debug
      container of docs/runbooks/network-policies.md comes from docker.io.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  validationActions: [{{ include "policies.action" (dict "root" . "name" "restrictImageRegistries") }}]
  failurePolicy: {{ .Values.failurePolicy }}
  {{- include "policies.autogen" . | nindent 2 }}
  matchConditions:
    {{- include "policies.notExempt" . | nindent 4 }}
  matchConstraints:
    {{- include "policies.matchPods" . | nindent 4 }}
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: "variables.containers.all(c, c.image.startsWith('{{ .Values.registry }}/'))"
      message: every container and init container must use an image from {{ .Values.registry }}
{{- end }}
