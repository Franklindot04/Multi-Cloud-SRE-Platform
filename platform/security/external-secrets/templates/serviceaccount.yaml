{{- /*
The service account of the controller, with the IAM role of the External Secrets Operator (IAM roles for service accounts). The role
is the only way the controller reaches AWS, so the chart refuses to render without it: an operator that starts without its role would
run and fail every read.
*/ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ index .Values "external-secrets" "serviceAccount" "name" }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    eks.amazonaws.com/role-arn: {{ required "roleArn must be set: Argo CD passes it from the cluster annotation platform.example/external-secrets-role-arn (Terraform output external_secrets_role_arn)" .Values.roleArn | quote }}
