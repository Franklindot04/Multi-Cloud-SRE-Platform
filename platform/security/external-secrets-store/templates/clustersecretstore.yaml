apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.name }}
  annotations:
    # The CRD comes from the operator Application (wave 3), which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    platform.example/parameter-prefix: {{ required "parameterPrefix must be set: Argo CD passes it from the cluster annotation platform.example/secrets-prefix (Terraform output secrets_parameter_prefix)" .Values.parameterPrefix | quote }}
spec:
  provider:
    aws:
      service: ParameterStore
      region: {{ required "region must be set: Argo CD passes it from the cluster annotation platform.example/region" .Values.region | quote }}
      auth:
        # The web identity token of this service account, exchanged for the IAM role named in the service account's annotation.
        jwt:
          serviceAccountRef:
            name: {{ .Values.serviceAccount.name }}
            namespace: {{ .Values.serviceAccount.namespace }}
