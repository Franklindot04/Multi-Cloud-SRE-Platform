---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-observability
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  description: Metrics, alerting, logging and tracing stack (Prometheus, Alertmanager, Grafana, Loki, Tempo) from platform/observability
  sourceRepos:
    - https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
  # Any registered cluster, but only the observability namespace, plus kube-system for the Service that the chart
  # creates there so that CoreDNS can be scraped. The monitors for the services and the data layer live in the
  # observability namespace and select their targets, so the shop and data namespaces are not destinations.
  destinations:
    - server: "*"
      namespace: observability
    - server: "*"
      namespace: kube-system
  # Cluster-scoped kinds the stack creates: the namespace itself, the operator's CRDs and the read-only roles of the
  # operator, Prometheus, kube-state-metrics and the log collector (Alloy reads pods, their logs and namespaces
  # cluster-wide). No webhook configurations, no priority classes. Anything else is rejected.
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
    - group: rbac.authorization.k8s.io
      kind: ClusterRole
    - group: rbac.authorization.k8s.io
      kind: ClusterRoleBinding
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    # Only rendered when persistence is switched on (values-persistent.yaml): Grafana's claim.
    - group: ""
      kind: PersistentVolumeClaim
    # Only for the Alertmanager configuration: the Prometheus Operator reads it from a Secret, which the stack chart
    # renders from the routing in kube-prometheus-stack/values.yaml. It holds routes and empty receivers and no
    # credential; scripts/chart-contract-check.py (alertmanager) fails if a receiver is not empty. The Grafana admin
    # password is not affected: it is generated in the cluster by a Job and is not a manifest in Git.
    - group: ""
      kind: Secret
    - group: ""
      kind: Service
    - group: ""
      kind: ServiceAccount
    - group: apps
      kind: Deployment
    # Loki runs as a StatefulSet. The claim it would create with values-persistent.yaml comes from the StatefulSet's
    # volume claim template, not from a manifest in Git.
    - group: apps
      kind: StatefulSet
    - group: batch
      kind: Job
    - group: rbac.authorization.k8s.io
      kind: Role
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    # Prometheus, ServiceMonitor, PodMonitor, PrometheusRule and the other monitoring.coreos.com kinds. The rules and
    # the Alertmanager resource use the same group.
    - group: monitoring.coreos.com
      kind: "*"
  orphanedResources:
    warn: true
