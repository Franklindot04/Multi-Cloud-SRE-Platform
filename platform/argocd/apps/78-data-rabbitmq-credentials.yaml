---
# Copies the RabbitMQ credentials into the shop namespace (a PreSync hook Job). Wave 8: after the broker
# (wave 7) has created its default user Secret. Needed by the services' data profile. The Sync hook Job waits for
# that Secret itself, because waves do not order separate Applications (ADR-0018).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: data-rabbitmq-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "8"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/data: "true"
  template:
    metadata:
      name: 'data-rabbitmq-credentials-{{ .nameNormalized }}'
      labels:
        platform.example/addon: data-rabbitmq-credentials
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-data
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/data/rabbitmq-credentials
        helm:
          releaseName: data-rabbitmq-credentials
          valueFiles:
            - values.yaml
          parameters:
            # External mode: the passwords come from Parameter Store through ExternalSecrets (clusters labelled
            # platform.example/external-secrets=true), not from the generator. Off when the label is absent.
            - name: externalSecrets.enabled
              value: '{{ default "false" (index .metadata.labels "platform.example/external-secrets") }}'
            - name: externalSecrets.prefix
              value: '{{ index .metadata.annotations "platform.example/secrets-prefix" }}'
              forceString: true
      destination:
        server: '{{ .server }}'
        namespace: shop
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 10m
