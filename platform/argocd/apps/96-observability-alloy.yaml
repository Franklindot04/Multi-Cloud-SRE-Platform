---
# Grafana Alloy (vendored, version-pinned Grafana chart): tails the pod logs of the shop and data namespaces through the
# Kubernetes API and pushes them to Loki. Wave 16: after Loki (wave 15). If Loki is not up yet, Alloy retries on its own.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "16"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/observability: "true"
  template:
    metadata:
      name: 'observability-alloy-{{ .nameNormalized }}'
      labels:
        platform.example/addon: observability-alloy
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-observability
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/observability/alloy
        helm:
          releaseName: alloy
          valueFiles:
            - values.yaml
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: latest
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: latest
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
