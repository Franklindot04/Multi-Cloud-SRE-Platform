---
# The gateway service from deploy/helm/service. Wave 22. Deployed to clusters labelled platform.example/apps=true
# (off by default). The profile comes from the cluster label platform.example/apps-profile: memory (default,
# no infrastructure) or data (PostgreSQL, Valkey and RabbitMQ in the data namespace).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "22"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/apps: "true"
  template:
    metadata:
      name: 'apps-gateway-{{ .nameNormalized }}'
      labels:
        platform.example/addon: apps-gateway
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-apps
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: deploy/helm/service
        helm:
          releaseName: gateway
          valueFiles:
            - ../values/images.yaml
            - ../values/gateway.yaml
            - '../values/gateway-{{ default "memory" (index .metadata.labels "platform.example/apps-profile") }}.yaml'
            - '../values/cloud-{{ index .metadata.labels "platform.example/cloud" }}.yaml'
            - ../values/gateway-rollout.yaml
          parameters:
            # A canary Rollout in place of the Deployment, only on a cluster that has the Argo Rollouts controller (the label set by
            # --enable-progressive-delivery) and only in the data profile. Without the label the chart renders the Deployment, as
            # before. The value is a bool for Helm, so it is not passed as a string (no forceString).
            - name: rollout.enabled
              value: >-
                {{ if and (eq (default "memory" (index .metadata.labels "platform.example/apps-profile")) "data")
                (eq (index .metadata.labels "platform.example/progressive-delivery") "true") }}true{{ else }}false{{ end }}
            # The AnalysisTemplate reads Prometheus, so it needs the observability layer as well; without it the canary has pauses only.
            - name: rollout.analysis.enabled
              value: >-
                {{ if and (eq (default "memory" (index .metadata.labels "platform.example/apps-profile")) "data")
                (eq (index .metadata.labels "platform.example/progressive-delivery") "true")
                (eq (index .metadata.labels "platform.example/observability") "true") }}true{{ else }}false{{ end }}
            # The address range of the cluster's Services, for the egress rules of the network policies.
            - name: networkPolicy.serviceCidr
              value: '{{ index .metadata.annotations "platform.example/service-cidr" }}'
              forceString: true
      destination:
        server: '{{ .server }}'
        namespace: shop
      syncPolicy:
        automated:
          # The project can only reach the shop namespace, so pruning cannot touch the data namespace or its volumes.
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 10m
