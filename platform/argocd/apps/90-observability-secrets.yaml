---
# Generates the Grafana admin credentials inside the cluster (an Argo CD Sync hook Job, with ordinary RBAC objects so the
# Application always has something to sync) and creates the observability namespace with Pod Security labels. Wave 10:
# only clusters labelled platform.example/observability=true get the metrics foundation. Grafana waits for its Secret
# itself (its pod stays in CreateContainerConfigError until the Secret exists), as in ADR-0018.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/observability: "true"
  template:
    metadata:
      name: 'observability-secrets-{{ .nameNormalized }}'
      labels:
        platform.example/addon: observability-secrets
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-observability
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/observability/secrets
        helm:
          releaseName: observability-secrets
          valueFiles:
            - values.yaml
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - PruneLast=true
        managedNamespaceMetadata:
          labels:
            pod-security.kubernetes.io/enforce: restricted
            pod-security.kubernetes.io/enforce-version: latest
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/warn-version: latest
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/audit-version: latest
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
