---
# PostgreSQL cluster and databases (custom resources). Wave 7: after the operator. A PreSync gate in the chart waits
# for the role Secrets from data-secrets before the Cluster is applied (ADR-0018). Profile standard (one
# instance) or ha (three) comes from the cluster label platform.example/data-profile.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: data-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/data: "true"
  template:
    metadata:
      name: 'data-postgres-{{ .nameNormalized }}'
      labels:
        platform.example/addon: data-postgres
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-data
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/data/postgres
        helm:
          releaseName: data-postgres
          valueFiles:
            - values.yaml
            - 'values-{{ default "standard" (index .metadata.labels "platform.example/data-profile") }}.yaml'
      destination:
        server: '{{ .server }}'
        namespace: data
      syncPolicy:
        automated:
          # Pruning never removes data: volume claims and the database resources carry Prune=false,
          # and PruneLast removes anything else only after everything else is healthy.
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
