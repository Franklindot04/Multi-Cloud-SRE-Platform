---
# Default-deny network policies for the kyverno namespace and the allow rules of the Kyverno controllers. Wave 19: after Kyverno
# (wave 18). Only EKS clusters get it. The VPC CNI network policy agent matches egress against Service addresses, so the chart
# allows the Service range (DNS, the API server) on the ports it needs; the API server calls the admission webhook from
# addresses inside the VPC, so the webhook port accepts the VPC range. Both ranges come from the cluster annotations
# platform.example/service-cidr and platform.example/vpc-cidr (written by scripts/bootstrap-argocd.sh), never from Git. Inside
# the Application the allow rules are applied (sync wave -2) before the deny (wave -1), so a deny never lands without them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: policy-network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "19"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/policy: "true"
            platform.example/cloud: aws
  template:
    metadata:
      name: 'policy-network-policies-{{ .nameNormalized }}'
      labels:
        platform.example/addon: policy-network-policies
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-addons
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/security/network-policies
        helm:
          releaseName: policy-network-policies
          valueFiles:
            - values.yaml
          parameters:
            - name: vpcCidr
              value: '{{ index .metadata.annotations "platform.example/vpc-cidr" }}'
              forceString: true
            - name: serviceCidr
              value: '{{ index .metadata.annotations "platform.example/service-cidr" }}'
              forceString: true
      destination:
        server: '{{ .server }}'
        namespace: kyverno
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
