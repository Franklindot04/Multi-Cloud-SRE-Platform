---
# Generates the data layer credentials inside the cluster (an Argo CD Sync hook Job, with ordinary RBAC objects so the
# Application always has something to sync). Wave 6. Waves order only how the ApplicationSets are created: the
# consumers do not rely on it, they wait for their Secrets themselves (ADR-0018).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: data-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/data: "true"
  template:
    metadata:
      name: 'data-secrets-{{ .nameNormalized }}'
      labels:
        platform.example/addon: data-secrets
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-data
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/data/secrets
        helm:
          releaseName: data-secrets
          valueFiles:
            - values.yaml
      destination:
        server: '{{ .server }}'
        namespace: data
      syncPolicy:
        automated:
          # Pruning never removes data: volume claims and the database resources carry Prune=false,
          # and PruneLast removes anything else only after everything else is healthy.
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
