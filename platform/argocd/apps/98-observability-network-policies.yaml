---
# Default-deny network policies for the observability namespace and the allow rules of the stack. Wave 17: after the stack
# and its pipelines (waves 10 to 16). Only EKS clusters get it. The VPC CNI network policy agent matches egress against Service
# addresses, so the chart allows the Service range (DNS, the API server, the Services Grafana and the pipelines use) on the
# ports it needs, and the VPC range for what Prometheus reaches by address (the kubelets on 10250, the API server endpoints on
# 443). Both ranges come from the cluster annotations platform.example/service-cidr and platform.example/vpc-cidr (written by
# scripts/bootstrap-argocd.sh), never from Git. Inside the Application the allow rules are applied (sync wave -2) before the
# deny (wave -1), so a deny never lands without them.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: observability-network-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "17"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - clusters:
        selector:
          matchLabels:
            platform.example/managed: "true"
            platform.example/observability: "true"
            platform.example/cloud: aws
  template:
    metadata:
      name: 'observability-network-policies-{{ .nameNormalized }}'
      labels:
        platform.example/addon: observability-network-policies
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-observability
      source:
        repoURL: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform.git
        targetRevision: main
        path: platform/observability/network-policies
        helm:
          releaseName: observability-network-policies
          valueFiles:
            - values.yaml
          parameters:
            - name: vpcCidr
              value: '{{ index .metadata.annotations "platform.example/vpc-cidr" }}'
              forceString: true
            - name: serviceCidr
              value: '{{ index .metadata.annotations "platform.example/service-cidr" }}'
              forceString: true
      destination:
        server: '{{ .server }}'
        namespace: observability
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - PruneLast=true
        retry:
          limit: 10
          backoff:
            duration: 15s
            factor: 2
            maxDuration: 5m
