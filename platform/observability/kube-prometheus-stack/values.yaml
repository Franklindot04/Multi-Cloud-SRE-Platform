---
# Prometheus Operator, Prometheus and Grafana for a small cluster of a couple of Spot nodes. Everything here is sized
# for that: modest requests, a short retention, no persistent volumes, an Alertmanager that only records alerts and no
# node-exporter.
# Access is by port-forward only (see platform/observability/README.md); there is no ingress.
kube-prometheus-stack:
  # The operator's CRDs (Prometheus, ServiceMonitor, PodMonitor, PrometheusRule and so on) are rendered by the chart
  # and are too large for client-side apply, so the Argo CD Application syncs with ServerSideApply=true.
  crds:
    enabled: true

  # Alertmanager: one replica, state in an emptyDir, reached by port-forward only. There is no real notification
  # channel and no secret in this repository, so the receivers are empty: they accept an alert and send it nowhere, and
  # the alert is visible in the Alertmanager UI. A real receiver (a chat webhook, for example) is added through a Secret
  # that holds the Alertmanager configuration, never as a URL in this file; see docs/runbooks/alerts.md.
  #
  # The routing tree, in order: alerts with severity page go to the receiver "page", severity ticket to "ticket", and
  # everything else to "default". Alerts are grouped by alertname, slo and service. A page alert for an SLO hides the
  # ticket alerts of the same SLO and service, and ServiceTargetDown hides the burn-rate alerts of the same service
  # (the rules are in platform/observability/monitors). scripts/observability-check.sh runs amtool check-config and
  # routing tests on the rendered configuration.
  alertmanager:
    enabled: true
    config:
      global:
        resolve_timeout: 5m
      route:
        receiver: default
        group_by:
          - alertname
          - slo
          - service
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        routes:
          # Page: tell as soon as it is known, and repeat every hour while it lasts.
          - matchers:
              - severity = "page"
            receiver: page
            group_wait: 10s
            group_interval: 2m
            repeat_interval: 1h
          # Ticket: wait a little so a flapping alert is one entry, and repeat once a day.
          - matchers:
              - severity = "ticket"
            receiver: ticket
            group_wait: 2m
            group_interval: 15m
            repeat_interval: 24h
      receivers:
        - name: default
        - name: page
        - name: ticket
      inhibit_rules:
        - source_matchers:
            - severity = "page"
          target_matchers:
            - severity = "ticket"
          equal:
            - slo
            - service
        - source_matchers:
            - alertname = "ServiceTargetDown"
          target_matchers:
            - alertname =~ "SLOBurnRate.*"
          equal:
            - service
    service:
      type: ClusterIP
    ingress:
      enabled: false
    alertmanagerSpec:
      replicas: 1
      # The pod settings are repeated from the chart so a chart change cannot loosen them. The operator gives the
      # containers a read-only root filesystem, no privilege escalation and no capabilities.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault
      # No storage: the operator uses an emptyDir, so silences and the notification log are lost when the pod is
      # rescheduled. To keep them, use values-persistent.yaml.
      storage: {}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi

  # The chart's default rules come in groups, not one by one, and bring dozens of alerts and the recording rules they
  # use, several for components this platform does not run. The rules of the platform are in the monitors chart, so
  # the defaults stay off (docs/adr/0023-slos-and-alerting.md).
  defaultRules:
    create: false

  # node-exporter needs hostNetwork, hostPID and hostPath volumes, which the restricted Pod Security level does
  # not allow, and the namespace enforces restricted. It is left out. Node CPU and memory still come from the
  # kubelet and cAdvisor. To add it later, deploy it into its own namespace that is allowed to be privileged
  # (see the README), not into this one.
  nodeExporter:
    enabled: false

  # The control plane of EKS and GKE is managed and does not expose these endpoints to the cluster, and kube-proxy
  # listens on localhost only, so their targets would always be down.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # No priority class is set on any pod of the stack, on purpose. The sample services use platform-apps; metrics must
  # never preempt them, and when a node is short of room the stack goes first.
  prometheusOperator:
    # The admission webhooks need a certificate and a hook Job to patch it in. They only validate rule files,
    # which are checked in CI instead, so they are off, and with them the operator's own TLS listener.
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    # The chart defaults already run as non-root with a read-only root filesystem, no privilege escalation, all
    # capabilities dropped and a RuntimeDefault seccomp profile; they are repeated so a chart change cannot
    # loosen them silently.
    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    prometheusConfigReloader:
      resources:
        requests:
          cpu: 10m
          memory: 24Mi
        limits:
          cpu: 50m
          memory: 48Mi

  prometheus:
    service:
      type: ClusterIP
    # The kubelet, API server and CoreDNS monitors authenticate with the Prometheus pod's own projected token, which
    # the kubelet rotates. The alternative is a long-lived token Secret, which is not created.
    serviceAccount:
      createTokenSecret: false
    # The scrape class that carries that authorization for the control-plane monitors.
    controlPlaneScrapeClass:
      enabled: true
    prometheusSpec:
      replicas: 1
      # Two days of data. With emptyDir the data is lost whenever the pod is rescheduled, so a longer retention
      # would only cost disk on the node. The size limit stops a high-cardinality mistake from filling it.
      retention: 2d
      retentionSize: 1GB
      scrapeInterval: 30s
      evaluationInterval: 30s
      walCompression: true
      enableAdminAPI: false
      # Select every ServiceMonitor, PodMonitor, Probe and PrometheusRule in every namespace, not only those
      # carrying this release's label, so monitors owned by other charts (the data layer, the services) are found.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      scrapeConfigSelectorNilUsesHelmValues: false
      resources:
        requests:
          cpu: 150m
          memory: 512Mi
        limits:
          cpu: 750m
          memory: 1Gi
      # No persistent volume in the default profile: with no storageSpec the operator uses an emptyDir. Metrics
      # are lost when the pod is rescheduled or the node is replaced; that is acceptable for a reference
      # platform on Spot nodes. To keep them, add values-persistent.yaml to the Application's value files
      # (a PersistentVolumeClaim on the platform's default StorageClass).
      storageSpec: {}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 2000
        fsGroup: 2000
        seccompProfile:
          type: RuntimeDefault

  grafana:
    enabled: true
    # The admin account comes from the Secret grafana-admin, generated in the cluster by the
    # observability-secrets chart. No password is set, defaulted or committed anywhere in this repository.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Dashboards are added in a later change. They will be ConfigMaps in this namespace labelled
    # grafana_dashboard: "1", which the sidecar loads; the chart's own dashboards need the default rules.
    defaultDashboardsEnabled: false
    # The Prometheus data source is a ConfigMap created by the chart and loaded by the sidecar. Loki and Tempo are added
    # next to it the same way, from the chart's additionalDataSources list. The URLs are the Services the loki and tempo
    # charts create in this namespace (platform/observability/loki and tempo). maxLines caps how many lines one log
    # query returns to the browser. A dollar sign that Grafana, not provisioning, must expand is written $$.
    #
    # The two are linked by their uids, which are fixed: a log line links to its trace, and a trace links to its logs.
    # The services write the trace id as "trace_id":"<32 lower-case hex digits>" in every request log line (apps/README.md),
    # so that is what the derived field matches, with the quotes and the length. scripts/chart-contract-check.py checks the
    # uids and tries the regular expression on sample lines in the format of each service.
    #
    # No service graph or node graph: both need the metrics generator of Tempo, which is off.
    additionalDataSources:
      - name: Loki
        type: loki
        uid: loki
        url: http://loki.observability.svc.cluster.local:3100
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          maxLines: 1000
          timeout: 60
          derivedFields:
            - name: trace_id
              matcherType: regex
              matcherRegex: '"trace_id":"([0-9a-f]{32})"'
              url: $${__value.raw}
              urlDisplayLabel: Trace
              datasourceUid: tempo
      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.observability.svc.cluster.local:3200
        access: proxy
        isDefault: false
        editable: false
        jsonData:
          timeout: 60
          nodeGraph:
            enabled: false
          # From a trace to its log lines: every line that carries the trace id, from five minutes before the span
          # starts to five minutes after it ends. The lines are found by the text of the id, not by a label, because the
          # trace id is not a label (it would be a new stream per request).
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
            filterByTraceID: false
            filterBySpanID: false
            customQuery: true
            query: '{namespace=~".+"} |= `$${__trace.traceId}`'
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
        labelValue: "1"
        # Only this namespace. The chart's default (ALL) needs a cluster-wide role to read ConfigMaps.
        searchNamespace: null
      datasources:
        enabled: true
        searchNamespace: null
        # The Alertmanager data source the chart adds next to Prometheus, with a fixed uid. Grafana does not manage
        # alerts of its own here; the data source only lets the alert list and Explore read Alertmanager.
        alertmanager:
          enabled: true
          name: Alertmanager
          uid: alertmanager
          handleGrafanaManagedAlerts: false
          implementation: prometheus
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          cpu: 100m
          memory: 128Mi
    # emptyDir: dashboards and data sources come from ConfigMaps, and nothing here is worth a volume. Users,
    # preferences and anything created in the UI are lost when the pod is rescheduled. To keep them, use
    # values-persistent.yaml.
    persistence:
      enabled: false
    initChownData:
      enabled: false
    rbac:
      namespaced: true
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 300m
        memory: 384Mi
    grafana.ini:
      analytics:
        check_for_updates: false
        reporting_enabled: false
      security:
        disable_gravatar: true
    # The chart defaults already meet the restricted Pod Security level; they are repeated so a chart change
    # cannot loosen them silently.
    securityContext:
      runAsNonRoot: true
      runAsUser: 472
      runAsGroup: 472
      fsGroup: 472
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
      seccompProfile:
        type: RuntimeDefault
    ingress:
      enabled: false
    # The chart's test Pod is a Helm hook that Argo CD does not run.
    testFramework:
      enabled: false

  kube-state-metrics:
    resources:
      requests:
        cpu: 10m
        memory: 48Mi
      limits:
        cpu: 100m
        memory: 128Mi
