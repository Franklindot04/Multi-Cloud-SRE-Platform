---
# Network policies for the observability namespace: Prometheus Operator, Prometheus, Alertmanager, Grafana,
# kube-state-metrics, the OpenTelemetry Collector, Loki, Alloy and Tempo.

# Turn the policies off (nothing is rendered, and Argo CD prunes what it created). The way back if a policy blocks something that
# must work; see docs/runbooks/network-policies.md.
enabled: true

namespace: observability

# The address range of the cluster's Services. The VPC CNI network policy agent matches an egress rule against the address the
# pod connects to, which for a Service (the Kubernetes API, the cluster DNS, the Prometheus and Loki Services) is its
# ClusterIP, translated to a pod only afterwards. So the API server is reached by port 443 to this range (the Service
# "kubernetes"), and every flow marked "service" below gets this range as a second peer next to the pod selector. Argo CD
# passes it from the cluster annotation platform.example/service-cidr, which scripts/bootstrap-argocd.sh writes from the
# Terraform output service_cidr_block. It is never committed, and the chart refuses to render without it.
serviceCidr: ""

# The address range of the VPC, for what Prometheus reaches by address and not through a Service: the kubelets (node
# addresses) and the addresses of the API server's network interfaces, which are the targets of the apiserver scrape (it
# follows the endpoints of the Service "kubernetes"). Argo CD passes it from the cluster annotation
# platform.example/vpc-cidr, which scripts/bootstrap-argocd.sh writes from the Terraform output vpc_cidr_block. It is never
# committed, and the chart refuses to render without it.
vpcCidr: ""

dns:
  namespace: kube-system
  podLabels:
    k8s-app: kube-dns

# The pods, by the labels the charts really put on them (see the Services in the rendered charts).
pods:
  prometheus:
    app.kubernetes.io/name: prometheus
    operator.prometheus.io/name: kube-prometheus-stack-prometheus
  alertmanager:
    app.kubernetes.io/name: alertmanager
    alertmanager: kube-prometheus-stack-alertmanager
  operator:
    app: kube-prometheus-stack-operator
  grafana:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: kube-prometheus-stack
  kube-state-metrics:
    app.kubernetes.io/name: kube-state-metrics
    app.kubernetes.io/instance: kube-prometheus-stack
  collector:
    app.kubernetes.io/name: otel-collector
  loki:
    app.kubernetes.io/name: loki
  alloy:
    app.kubernetes.io/name: alloy
  tempo:
    app.kubernetes.io/name: tempo

# Pods that call the Kubernetes API and so get TCP 443 to the Service range, each on its own and not the whole namespace:
# the Prometheus Operator, Prometheus (service discovery, and the API server itself is scraped), kube-state-metrics, the
# Grafana sidecars (they watch ConfigMaps), Alloy (it reads pod logs through the API) and the Job that makes the Grafana
# admin Secret.
apiAccess:
  - name: prometheus-operator
    matchLabels:
      app: kube-prometheus-stack-operator
  - name: prometheus
    matchLabels:
      app.kubernetes.io/name: prometheus
      operator.prometheus.io/name: kube-prometheus-stack-prometheus
  - name: kube-state-metrics
    matchLabels:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: kube-prometheus-stack
  - name: grafana
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: kube-prometheus-stack
  - name: alloy
    matchLabels:
      app.kubernetes.io/name: alloy
  - name: secrets-job
    matchLabels:
      batch.kubernetes.io/job-name: observability-secrets-generator

# Traffic inside the namespace. Each entry allows the pod "from" to open connections to the pod "to" on the ports, and
# renders both halves: an egress policy on "from" and an ingress policy on "to". "service: true" marks a connection that goes
# through a Service (its ClusterIP is what the egress rule is matched against), so the egress policy also allows the Service
# range on those ports. Without it the connection goes to the pod address (Prometheus follows the endpoints of a Service and
# connects to the pods).
flows:
  # Prometheus scrapes the stack (Alertmanager's 9093 is also where it sends alerts) ...
  - {from: prometheus, to: grafana, ports: [3000]}
  - {from: prometheus, to: kube-state-metrics, ports: [8080]}
  - {from: prometheus, to: alertmanager, ports: [9093, 8080]}
  - {from: prometheus, to: operator, ports: [8080]}
  - {from: prometheus, to: loki, ports: [3100]}
  - {from: prometheus, to: alloy, ports: [12345]}
  - {from: prometheus, to: tempo, ports: [3200]}
  - {from: prometheus, to: collector, ports: [8888, 8889]}
  # ... the operator checks the Prometheus and Alertmanager it runs (by pod address, or through their Services; both are
  # allowed because it is not certain which the operator uses) ...
  - {from: operator, to: prometheus, ports: [9090, 8080], service: true}
  - {from: operator, to: alertmanager, ports: [9093, 8080], service: true}
  # ... Grafana reads its data sources through their Services ...
  - {from: grafana, to: prometheus, ports: [9090], service: true}
  - {from: grafana, to: loki, ports: [3100], service: true}
  - {from: grafana, to: tempo, ports: [3200], service: true}
  - {from: grafana, to: alertmanager, ports: [9093], service: true}
  # ... and the telemetry pipelines push through the Services: logs to Loki, traces to Tempo.
  - {from: alloy, to: loki, ports: [3100], service: true}
  - {from: collector, to: tempo, ports: [4317], service: true}

# Where the sample services run: they send traces to the Collector, and Prometheus scrapes their metrics ports.
services:
  namespace: shop
  # The metrics ports of the four services (gateway, orders, payments, notifier), contiguous.
  metricsPortFirst: 8080
  metricsPortLast: 8083
  collectorPort: 4317

# The data layer, scraped by Prometheus.
data:
  namespace: data
  postgres:
    podLabels:
      cnpg.io/cluster: platform-pg
      cnpg.io/podRole: instance
    metricsPort: 9187
  rabbitmq:
    podLabels:
      app.kubernetes.io/name: platform-mq
      app.kubernetes.io/component: rabbitmq
    metricsPort: 15692

# Kyverno (platform/security/kyverno): Prometheus scrapes the metrics port of its four controllers, by pod address.
kyverno:
  namespace: kyverno
  podLabels:
    app.kubernetes.io/part-of: kyverno
  metricsPort: 8000

# CoreDNS exposes metrics on this port; Prometheus scrapes it through the Service the stack creates in kube-system.
coredns:
  port: 9153

# The kubelet port, scraped on every node for the kubelet and cAdvisor metrics.
kubeletPort: 10250
