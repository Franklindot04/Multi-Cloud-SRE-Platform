---
# A Sync hook Job creates the Secret only if it does not exist yet, with a random password generated in the
# cluster. An existing Secret is never changed, so re-syncs do not rotate the password. Nothing is printed
# except the name of the Secret.
image: curlimages/curl:8.23.0

namespace: observability

# The hook Job runs before Grafana starts; it ranks with the stack.
priorityClassName: platform-observability

grafana:
  # Read by the Grafana admin settings in the kube-prometheus-stack chart (admin.existingSecret).
  secret: grafana-admin
  adminUser: admin
  # The path of the password in scripts/secrets/manifest.yaml (external mode).
  parameter: grafana/admin-password

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# The generator Job runs during a sync (an Argo CD Sync hook) and is removed when it succeeds. A failed one is
# kept for inspection and removed after ttlSecondsAfterFinished.
job:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600

# Where the passwords come from. Off (the default): the generator Job in this chart makes them in the cluster, once, as before.
# On: the generator, its RBAC and the Secrets it makes are not rendered; ExternalSecrets make the same Secrets (same names, types,
# labels and keys) from the SecureString parameters of AWS Systems Manager Parameter Store, which scripts/seed-secrets.sh writes,
# through the ClusterSecretStore below. Argo CD sets enabled from the cluster label platform.example/external-secrets and prefix
# from the annotation platform.example/secrets-prefix (/<prefix>/<environment>, for example /multi-cloud-sre/dev); the chart
# refuses to render without the prefix when enabled. The parameter names are the paths of scripts/secrets/manifest.yaml.
externalSecrets:
  enabled: false
  prefix: ""
  storeName: aws-parameter-store
  refreshInterval: 1h
