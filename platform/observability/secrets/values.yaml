---
# A Sync hook Job creates the Secret only if it does not exist yet, with a random password generated in the
# cluster. An existing Secret is never changed, so re-syncs do not rotate the password. Nothing is printed
# except the name of the Secret.
image: curlimages/curl:8.23.0

namespace: observability

grafana:
  # Read by the Grafana admin settings in the kube-prometheus-stack chart (admin.existingSecret).
  secret: grafana-admin
  adminUser: admin

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# The generator Job runs during a sync (an Argo CD Sync hook) and is removed when it succeeds. A failed one is
# kept for inspection and removed after ttlSecondsAfterFinished.
job:
  backoffLimit: 6
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
