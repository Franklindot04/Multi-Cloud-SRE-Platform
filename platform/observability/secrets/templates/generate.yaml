{{- /*
The ServiceAccount, Role and RoleBinding are ordinary resources (sync wave -5), so the Application always has
something to sync and Argo CD starts the first sync on its own. A chart that contains only hooks renders nothing
to compare, so Argo CD reports it Synced and Healthy without ever running a sync, and the Job never runs.

The generator is an Argo CD Sync hook (wave 0, after the RBAC): it runs during a sync, is removed when it
succeeds, and is not compared with the live state, so its disappearance never makes the Application OutOfSync
and nothing re-runs it in a loop. ttlSecondsAfterFinished cleans up a failed Job after an hour.

The Job is not a Helm hook: this chart is the credential generator, and the rule in scripts/chart-contract-check.py
is that a Job which creates Secrets is an Argo CD hook only.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-secrets-manifest
  namespace: {{ .Values.namespace }}
  labels:
    platform.example/purpose: credential-generator
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
data:
  # Names only, never values: the Secrets this chart makes sure exist. Created once and never overwritten.
  secrets: |
    {{ .Values.namespace }}/{{ .Values.grafana.secret }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: observability-secrets-generator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: observability-secrets-generator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: observability-secrets-generator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: observability-secrets-generator
subjects:
  - kind: ServiceAccount
    name: observability-secrets-generator
    namespace: {{ .Values.namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: observability-secrets-generator
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: {{ .Values.job.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.job.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.job.ttlSecondsAfterFinished }}
  template:
    spec:
      serviceAccountName: observability-secrets-generator
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: generate
          image: {{ .Values.image }}
          command: ["/bin/sh", "-ec"]
          args:
            - |
              API=https://kubernetes.default.svc
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              TOKEN="$(cat "$SA/token")"

              call() { curl -sS --max-time 20 --cacert "$SA/ca.crt" -H "Authorization: Bearer $TOKEN" "$@"; }
              http_status() { call -o /dev/null -w '%{http_code}' "$API/api/v1/namespaces/$1/secrets/$2"; }
              new_password() { head -c 48 /dev/urandom | base64 | tr -d '/+=\n' | head -c 32; }

              # create NAMESPACE NAME JSON: 201 created, 409 already exists, anything else is an error. The response
              # of a failed call is printed for diagnosis; the request, which carries the password, is not.
              create() {
                code="$(call -o /tmp/response -w '%{http_code}' -X POST -H 'Content-Type: application/json' \
                  -d "$3" "$API/api/v1/namespaces/$1/secrets")"
                case "$code" in
                  201) echo "created $1/$2" ;;
                  409) echo "exists  $1/$2" ;;
                  *) echo "failed  $1/$2: HTTP $code" >&2; cat /tmp/response >&2; exit 1 ;;
                esac
              }

              # An existing Secret is never regenerated or overwritten.
              if [ "$(http_status {{ .Values.namespace }} {{ .Values.grafana.secret }})" = 200 ]; then
                echo "exists  {{ .Values.namespace }}/{{ .Values.grafana.secret }}"
              else
                pw="$(new_password)"
                create {{ .Values.namespace }} {{ .Values.grafana.secret }} "{\"apiVersion\":\"v1\",\"kind\":\"Secret\",\"metadata\":{\"name\":\"{{ .Values.grafana.secret }}\"},\"type\":\"Opaque\",\"stringData\":{\"admin-user\":\"{{ .Values.grafana.adminUser }}\",\"admin-password\":\"$pw\"}}"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 8Mi
