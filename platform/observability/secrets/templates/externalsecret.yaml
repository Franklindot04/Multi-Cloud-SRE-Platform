{{- /*
The Secret grafana-admin, made by External Secrets from Parameter Store instead of the generator Job (templates/generate.yaml): same
name, namespace and keys (admin-user, admin-password), so the stack's values do not change. Rendered only when externalSecrets.enabled
is true. The user name is fixed; only the password comes from the parameter. Grafana's pod waits for the Secret.
*/ -}}
{{- if include "secrets.external" . }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.grafana.secret }}
  namespace: {{ .Values.namespace }}
  annotations:
    # The CRD comes from the operator Application (wave 3), which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "-5"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.externalSecrets.storeName }}
  target:
    name: {{ .Values.grafana.secret }}
    creationPolicy: Owner
    template:
      data:
        admin-user: {{ .Values.grafana.adminUser | quote }}
        admin-password: {{ `"{{ .password }}"` }}
  data:
    - secretKey: password
      remoteRef:
        key: {{ include "secrets.parameter" (dict "root" $ "path" .Values.grafana.parameter) }}
{{- end }}
