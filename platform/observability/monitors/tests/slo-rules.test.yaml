---
# Unit tests for the SLO recording rules and burn-rate alerts (docs/adr/0023-slos-and-alerting.md).
#
# scripts/observability-check.sh renders the monitors chart, writes the rules of the PrometheusRule "slo" to
# slo-rules.yaml next to a copy of this file, and runs `promtool test rules` with the promtool of the Prometheus image the
# stack deploys. Run it by hand the same way: see the script.
#
# promtool evaluates the rule groups in an arbitrary order unless group_eval_order says otherwise. The alerts read the
# recorded series of the same evaluation, and with an evaluation interval of 5 minutes (the length of the default
# look-back) a recorded series that has not been written yet is simply missing, so the order below is needed for the
# results to be the same on every run. Prometheus itself evaluates every 30 seconds and does not depend on the order.
#
# The series are counters with one sample a minute and the rules are evaluated every 5 minutes. Most scenarios start with
# three days of history, because the 3d window of the slowest alert would otherwise be only partly filled and every
# ratio would be computed over the few samples there are. Times are written relative to the start of the scenario.
#
# The ratios in the scenarios are chosen so that the arithmetic can be done by hand; the comments show it. The
# alert thresholds are burn x error budget: for gateway availability (budget 0.5%) 7.2% (14.4x), 3% (6x), 1.5% (3x)
# and 0.5% (1x); for gateway latency (budget 5%) 72%, 30%, 15% and 5%; for notification delivery (budget 1%) 14.4%,
# 6%, 3% and 1%.
rule_files:
  - slo-rules.yaml

evaluation_interval: 5m

group_eval_order:
  - slo-recording-short
  - slo-recording-long
  - slo-alerts
  - slo-blind-spots

tests:
  # Recording rules, worked by hand
  # Gateway availability: 0.9 requests a second succeed (200), 0.1 fail (500), so the error ratio is 0.1 / (0.9 + 0.1) =
  # 0.1. The 404 responses (0.5 a second) are client errors and are in neither count, and the failing /healthz route and
  # the other service are not counted. Valid events in an hour: 1 a second x 3600 = 3600. Gateway latency: 1 request a
  # second, of which 0.75 are at most 0.5 s (the bucket), so the bad share is 0.25; the slow /healthz requests are not
  # counted. Notifier: 98 processed, 1 duplicate and 1 dead-lettered a minute give 1 / 100 = 0.01; the retries (7 a
  # minute) and errors (3 a minute) are not counted; valid events in an hour: 100 x 60 = 6000.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+54x120'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+6x120'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="404"}'
        values: '0+30x120'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/healthz",status="500"}'
        values: '0+60x120'
      - series: 'http_requests_total{service="orders",job="orders",method="GET",route="/orders",status="500"}'
        values: '0+60x120'
      - series: 'http_request_duration_seconds_count{service="gateway",job="gateway",method="GET",route="/api/orders"}'
        values: '0+60x120'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="0.5"}'
        values: '0+45x120'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="0.1"}'
        values: '0+30x120'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="+Inf"}'
        values: '0+60x120'
      - series: 'http_request_duration_seconds_count{service="gateway",job="gateway",method="GET",route="/healthz"}'
        values: '0+60x120'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/healthz",le="0.5"}'
        values: '0+0x120'
      - series: 'messages_consumed_total{job="notifier",result="processed"}'
        values: '0+98x120'
      - series: 'messages_consumed_total{job="notifier",result="duplicate"}'
        values: '0+1x120'
      - series: 'messages_consumed_total{job="notifier",result="dead_letter"}'
        values: '0+1x120'
      - series: 'messages_consumed_total{job="notifier",result="retry"}'
        values: '0+7x120'
      - series: 'messages_consumed_total{job="notifier",result="error"}'
        values: '0+3x120'
    promql_expr_test:
      - expr: 'slo:objective:ratio{slo="gateway-availability", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:objective:ratio{slo="gateway-availability", service="gateway"}'
            value: 0.995
      - expr: 'slo:error_budget:ratio{slo="gateway-latency", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:error_budget:ratio{slo="gateway-latency", service="gateway"}'
            value: 0.05
      - expr: 'slo:sli_error:ratio_rate5m{slo="gateway-availability", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="gateway-availability", service="gateway"}'
            value: 0.1
      - expr: 'slo:sli_error:ratio_rate1h{slo="gateway-availability", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate1h{slo="gateway-availability", service="gateway"}'
            value: 0.1
      - expr: 'slo:sli_events:increase1h{slo="gateway-availability", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:increase1h{slo="gateway-availability", service="gateway"}'
            value: 3600
      - expr: 'slo:sli_error:ratio_rate5m{slo="gateway-latency", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate5m{slo="gateway-latency", service="gateway"}'
            value: 0.25
      - expr: 'slo:sli_events:increase1h{slo="gateway-latency", service="gateway"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:increase1h{slo="gateway-latency", service="gateway"}'
            value: 3600
      - expr: 'slo:sli_error:ratio_rate30m{slo="notifier-delivery", service="notifier"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_error:ratio_rate30m{slo="notifier-delivery", service="notifier"}'
            value: 0.01
      - expr: 'slo:sli_events:increase1h{slo="notifier-delivery", service="notifier"}'
        eval_time: 90m
        exp_samples:
          - labels: 'slo:sli_events:increase1h{slo="notifier-delivery", service="notifier"}'
            value: 6000

  # Inside the budget: no alert
  # Four days of steady traffic with 0.2 in 60 requests failing (0.33%, a burn of 0.67x against a budget of 0.5%), 1 in 60
  # requests slower than 0.5 s (1.7%, a burn of 0.33x against 5%) and 0.5 in 100 events dead-lettered (0.5%, a burn of
  # 0.5x against 1%). The burn is below 1, so not even the ticket alerts pend.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+59.8x5760'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+0.2x5760'
      - series: 'http_request_duration_seconds_count{service="gateway",job="gateway",method="GET",route="/api/orders"}'
        values: '0+60x5760'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="0.5"}'
        values: '0+59x5760'
      - series: 'messages_consumed_total{job="notifier",result="processed"}'
        values: '0+99.5x5760'
      - series: 'messages_consumed_total{job="notifier",result="dead_letter"}'
        values: '0+0.5x5760'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 1h
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 1d
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 2d
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 3d
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 4d
        exp_samples: []

  # Fast burn: a total outage pages, then recovers
  # Three days of healthy traffic (60 requests a minute), then two hours in which every request fails, then healthy again.
  # The 5xx counter grows by 60 a minute during the outage and the 200 counter stands still.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+60x4320 259200+0x119 259260+60x600'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+0x4320 60+60x119 7200+0x600'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4320m
        exp_samples: []
      # 25 minutes into a total outage. Error ratios: 1h window 25/60 = 42% (needs 7.2%, crossed after about 4.5 minutes);
      # 6h window 25/360 = 6.9% (needs 3%, crossed after 10.8 minutes, then 5 minutes of 'for'); 1d window 25/1440 = 1.7%
      # (needs 1.5%, crossed after 21.6 minutes, then 15 minutes of 'for', so only pending). Both page alerts fire.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4345m
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageFast", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
      # 115 minutes in: the ticket alerts have waited out their 'for' and all four fire.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4435m
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageFast", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      # The outage ended 60 minutes ago. The 5m and 30m windows are clean, so the page alerts have stopped; the 2h window
      # still holds 60 minutes of outage (50%), so both ticket alerts still fire.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4500m
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      # 3 hours after the outage ended the 2h window is clean, but the 6h window still holds 120 minutes of it (33%).
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4620m
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      # 6 hours after it ended nothing is left.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4800m
        exp_samples: []

  # Slow burn: only the ticket alerts fire
  # Four days in which 1.2 of every 60 gateway requests fail (2%, a burn of 4x against the 0.5% budget). The windows are
  # never longer than the data, so each one shows 2%: above the ticket thresholds (1.5% and 0.5%), below the page
  # thresholds (3% and 7.2%).
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+58.8x5760'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+1.2x5760'
    promql_expr_test:
      # Constant 2% errors is a burn of 4x. That is above 3x and 1x (tickets) and below 6x and 14.4x (pages).
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1

  # Between the two page thresholds: only the slow page alert fires
  # Four days in which 3 of every 60 gateway requests fail (5%, a burn of 10x). That is above 6x (3%) and below 14.4x (7.2%),
  # so the 6h page alert fires and the 1h one does not; the ticket alerts (1.5%, 0.5%) fire as well.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+57x5760'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+3x5760'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1

  # Above the fast page threshold: all four alerts fire
  # Four days in which 6 of every 60 gateway requests fail (10%, a burn of 20x), above every threshold (7.2%, 3%, 1.5%, 0.5%).
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+54x5760'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+6x5760'
    promql_expr_test:
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageFast", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1

  # Low traffic: three failing requests an hour do not alert
  # A request every 20 minutes, all failing: an error ratio of 100%, far above every threshold. The counter grows by 0.05
  # a minute (fractions are fine for the arithmetic). The guard needs events x burn x budget to be at least 5: 1h: 3 x
  # 14.4 x 0.005 = 0.22; 6h: 18 x 6 x 0.005 = 0.54; 1d: 72 x 3 x 0.005 = 1.1; 3d: 216 x 1 x 0.005 = 1.1.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+0.05x5760'
    promql_expr_test:
      # Every request fails, but there are 3 an hour. In the long windows that is 3, 18, 72 and 216 requests, and the
      # alert thresholds mean 0.2, 0.5, 1.1 and 1.1 bad requests: below the minimum of 5, so nothing fires.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 1h
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 1d
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 3d
        exp_samples: []
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*"}'
        eval_time: 4d
        exp_samples: []

  # Low traffic: the guard is per window
  # Ten times the traffic of the previous scenario, still all failing. The one-hour window is still too thin for the fast
  # page alert, the longer windows are not.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+0.5x5760'
    promql_expr_test:
      # 30 requests an hour, all failing. Events x burn x budget: 1h: 30 x 14.4 x 0.005 = 2.2 (below 5, so no fast page);
      # 6h: 180 x 6 x 0.005 = 5.4; 1d: 720 x 3 x 0.005 = 10.8; 3d: 2160 x 1 x 0.005 = 10.8 (all at least 5, once the
      # window holds that many events). After one day the 3d window holds only 720 events: 720 x 1 x 0.005 = 3.6, so the
      # slow ticket waits; after four days it fires.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-availability", service="gateway"}
            value: 1

  # Latency: 20% slow requests raise tickets only
  # A request a second; 48 of every 60 are in the 0.5 s bucket, 12 are slower (20%). The other buckets do not matter to
  # the SLI, they are there because a histogram has them.
  - interval: 1m
    input_series:
      - series: 'http_request_duration_seconds_count{service="gateway",job="gateway",method="GET",route="/api/orders"}'
        values: '0+60x5760'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="0.1"}'
        values: '0+30x5760'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="0.5"}'
        values: '0+48x5760'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="1"}'
        values: '0+58x5760'
      - series: 'http_request_duration_seconds_bucket{service="gateway",job="gateway",method="GET",route="/api/orders",le="+Inf"}'
        values: '0+60x5760'
    promql_expr_test:
      # 20% of requests slower than 0.5 s is a burn of 4x against the 5% budget: tickets (3x, 1x), not pages (6x, 14.4x).
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1h
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-latency", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-latency", service="gateway"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketFast", alertstate="firing", severity="ticket",
              slo="gateway-latency", service="gateway"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="gateway-latency", service="gateway"}
            value: 1

  # Notification delivery: a burn of 2x raises the slow ticket only
  # 100 events a minute, 98 recorded and 2 dead-lettered, for four days.
  - interval: 1m
    input_series:
      - series: 'messages_consumed_total{job="notifier",result="processed"}'
        values: '0+98x5760'
      - series: 'messages_consumed_total{job="notifier",result="dead_letter"}'
        values: '0+2x5760'
    promql_expr_test:
      # 2 in 100 dead-lettered is a burn of 2x against the 1% budget: above 1x (slow ticket), below 3x.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 1d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="notifier-delivery", service="notifier"}
            value: 1
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4d
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRateTicketSlow", alertstate="firing", severity="ticket",
              slo="notifier-delivery", service="notifier"}
            value: 1

  # Notification delivery: every event dead-lettered pages
  # Three days of 100 events a minute all recorded, then every event is dead-lettered.
  - interval: 1m
    input_series:
      - series: 'messages_consumed_total{job="notifier",result="processed"}'
        values: '0+100x4320 432000+0x600'
      - series: 'messages_consumed_total{job="notifier",result="dead_letter"}'
        values: '0+0x4320 100+100x599'
    promql_expr_test:
      # 35 minutes into a total failure. With a 1% budget the thresholds are 14.4% (1h window: crossed after 8.6 minutes)
      # and 6% (6h window: crossed after 21.6 minutes, then 5 minutes of 'for'); the 1d window needs 3% = 43 minutes.
      - expr: 'ALERTS{alertname=~"SLOBurnRate.*", alertstate="firing"}'
        eval_time: 4355m
        exp_samples:
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageFast", alertstate="firing", severity="page",
              slo="notifier-delivery", service="notifier"}
            value: 1
          - labels: >-
              ALERTS{alertname="SLOBurnRatePageSlow", alertstate="firing", severity="page",
              slo="notifier-delivery", service="notifier"}
            value: 1

  # The text of one alert, in full: labels, annotations and the link to the runbook. 25 minutes into the outage of the
  # fast-burn scenario the error ratio over the last hour is about 25 of 60 minutes = 41.7%; the rate extrapolation to the
  # edges of the window makes it 41.96%.
  - interval: 1m
    input_series:
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="200"}'
        values: '0+60x4320 259200+0x119 259260+60x600'
      - series: 'http_requests_total{service="gateway",job="gateway",method="GET",route="/api/orders",status="500"}'
        values: '0+0x4320 60+60x119 7200+0x600'
    alert_rule_test:
      - alertname: SLOBurnRatePageFast
        eval_time: 4345m
        exp_alerts:
          - exp_labels:
              severity: page
              slo: gateway-availability
              service: gateway
            exp_annotations:
              summary: "gateway-availability: error budget burning at 14.4x or faster over 1h and 5m"
              description: >-
                The error ratio of gateway-availability over the last 1h is 41.96%
                and it is above 14.4x the error budget (0.005, objective 0.995) over the last
                5m as well. At this rate: 2% of the budget in an hour; the whole budget in about 2 days.
              runbook_url: "https://github.com/Franklindot04/Multi-Cloud-SRE-Platform/blob/main/docs/runbooks/alerts.md\
                #slo-burn-rate-page-fast"

  # The alerts for what the SLOs cannot see.
  - interval: 1m
    input_series:
      - series: 'up{job="orders", namespace="shop", instance="10.0.0.1:8081"}'
        values: '1x20 0x30'
      - series: 'up{job="loki", namespace="observability", instance="10.0.0.2:3100"}'
        values: '0x50'
      - series: 'amqp_connected{job="notifier", instance="10.0.0.3:8083"}'
        values: '1x20 0x40'
      - series: 'outbox_oldest_unpublished_age_seconds{job="orders", instance="10.0.0.1:8081"}'
        values: '0x20 400x40'
    alert_rule_test:
      # Down from minute 20: the first evaluation that sees it is at 20, and the alert fires 5 minutes later. A target in
      # another namespace is not covered.
      - alertname: ServiceTargetDown
        eval_time: 20m
        exp_alerts: []
      - alertname: ServiceTargetDown
        eval_time: 30m
        exp_alerts:
          - exp_labels:
              severity: page
              service: orders
              job: orders
              namespace: shop
              instance: 10.0.0.1:8081
            exp_annotations:
              summary: "orders cannot be scraped"
              description: >-
                Prometheus has not been able to scrape orders (10.0.0.1:8081) for 5 minutes. The
                pod may be down or not ready, and the SLO alerts cannot see a service that serves no requests.
              runbook_url: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform/blob/main/docs/runbooks/alerts.md#service-target-down
      - alertname: NotifierBrokerDisconnected
        eval_time: 25m
        exp_alerts: []
      - alertname: NotifierBrokerDisconnected
        eval_time: 40m
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: notifier
              job: notifier
              instance: 10.0.0.3:8083
            exp_annotations:
              summary: "The notifier has no RabbitMQ connection"
              description: >-
                The notifier has had no broker connection for 10 minutes (10.0.0.3:8083). Events wait in the queue
                and the notification SLO sees none of them until it reconnects.
              runbook_url: "https://github.com/Franklindot04/Multi-Cloud-SRE-Platform/blob/main/docs/runbooks/alerts.md#noti\
                fier-broker-disconnected"
      - alertname: OutboxBacklog
        eval_time: 25m
        exp_alerts: []
      - alertname: OutboxBacklog
        eval_time: 40m
        exp_alerts:
          - exp_labels:
              severity: ticket
              service: orders
              job: orders
              instance: 10.0.0.1:8081
            exp_annotations:
              summary: "Order events are not leaving the outbox"
              description: >-
                The oldest unpublished order event is 6m 40s old (for 10 minutes the lag has
                been above 5 minutes). The notifier receives nothing, so the notification SLO shows no failure.
              runbook_url: https://github.com/Franklindot04/Multi-Cloud-SRE-Platform/blob/main/docs/runbooks/alerts.md#outbox-backlog
