{{- if .Values.secrets.externalSecrets.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: external-secrets
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/name: external-secrets-monitor
    app.kubernetes.io/part-of: observability
  annotations:
    # The CRD comes from the kube-prometheus-stack Application, which may not have synced yet.
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  jobLabel: app.kubernetes.io/name
  namespaceSelector:
    matchNames:
      - {{ .Values.secrets.externalSecrets.namespace }}
  # The controller, the webhook and the certificate controller each have a Service with the port "metrics" (8080); the webhook's
  # Service also has the port "webhook", which this monitor does not use. All of them carry the instance label of the release.
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.secrets.externalSecrets.interval }}
{{- end }}
