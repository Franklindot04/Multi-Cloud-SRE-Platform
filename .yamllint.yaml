---
extends: default

ignore: |
  .terraform/
  node_modules/
  apps/orders/.venv/
  apps/payments/target/
  platform/addons/*/templates/
  platform/addons/*/charts/
  platform/argocd/install/charts/
  platform/argocd/install/Chart.lock
  platform/addons/*/Chart.lock
  platform/data/*/templates/
  platform/data/*/charts/
  platform/data/*/Chart.lock
  platform/data/rabbitmq-operator/cluster-operator.yml

rules:
  line-length:
    max: 140
    level: warning
  document-start: disable
  truthy:
    check-keys: false
  comments:
    min-spaces-from-content: 1
